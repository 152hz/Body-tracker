<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>我的體態紀錄</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  background:#f6f5f2;
  color:#272727;
}

.app{
  max-width:760px;
  margin:auto;
  padding:20px 16px 90px;
}

.hero{
  background:#222;
  color:#fff;
  border-radius:28px;
  padding:24px 22px;
  margin-bottom:14px;
}

h1{
  margin:0 0 5px;
  font-size:28px;
}

h2{
  font-size:18px;
  margin:0 0 14px;
}

.muted{
  opacity:.68;
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:18px;
}

.stat{
  background:#ffffff12;
  border-radius:18px;
  padding:14px;
}

.stat b{
  display:block;
  font-size:20px;
  margin-top:3px;
}

.card{
  background:white;
  border-radius:24px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 3px 15px #00000008;
}

input,
select,
button{
  font:inherit;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:13px;
  background:#fff;
}

input:disabled,
select:disabled{
  background:#f0f0f0;
  color:#666;
  cursor:not-allowed;
}

label{
  font-size:12px;
  color:#777;
  display:block;
  margin:9px 0 5px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.btn{
  border:0;
  border-radius:14px;
  padding:12px 15px;
  background:#222;
  color:white;
  cursor:pointer;
  font-weight:600;
}

.btn.light{
  background:#eee;
  color:#222;
}

.btn.secondary{
  background:#4a5568;
  color:white;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions .btn{
  flex:1;
}

.progress{
  height:13px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0;
  background:#222;
  border-radius:20px;
  transition:.3s;
}

.meal{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.meal:last-child{
  border:0;
}

.meal small{
  color:#888;
  display:block;
}

.del{
  border:0;
  background:#f1f1f1;
  border-radius:9px;
  padding:5px 8px;
  cursor:pointer;
}

/* 食物搜尋 */

.food-search{
  position:relative;
}

.food-suggest{
  position:absolute;
  z-index:9999;
  left:0;
  right:0;
  top:100%;
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  margin-top:5px;
  max-height:300px;
  overflow-y:auto;
  box-shadow:0 8px 24px rgba(0,0,0,.15);
}

.food-option{
  padding:12px 13px;
  border-bottom:1px solid #eee;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.food-option:hover{
  background:#f8f8f8;
}

.food-option:last-child{
  border-bottom:0;
}

.food-option b{
  display:block;
  font-size:14px;
}

.food-option small{
  color:#777;
  white-space:nowrap;
}

.store-tag{
  display:inline-block;
  font-size:11px;
  padding:2px 6px;
  border-radius:6px;
  background:#e2e8f0;
  color:#2d3748;
  margin-right:6px;
  font-weight:bold;
}

.store-tag.seven{
  background:#feebc8;
  color:#c05621;
}

.store-tag.family{
  background:#c3dafe;
  color:#2c5282;
}

.store-tag.hilife{
  background:#fed7d7;
  color:#9b2c2c;
}

.store-tag.custom{
  background:#c6f6d5;
  color:#22543d;
}

.store-tag.api{
  background:#e9d8fd;
  color:#553c9a;
}

.hint{
  font-size:11px;
  color:#888;
  margin-top:5px;
}

.food-match{
  font-size:12px;
  color:#555;
  margin-top:6px;
  min-height:16px;
}

#chart{
  width:100%;
  height:180px;
  background:#fafafa;
  border-radius:16px;
}

.empty{
  text-align:center;
  color:#999;
  padding:20px;
}

@media(min-width:650px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>


<body>

<div class="app">

<!-- ==================== 頂部 ==================== -->

<section class="hero">

<div class="muted">
PERSONAL BODY TRACKER
</div>

<h1>
我的體態紀錄 🐷
</h1>

<div class="muted">
把每天的體重與吃的東西記下來
</div>

<div class="grid">

<div class="stat">
<span class="muted">目前體重</span>

</div>

<div class="stat">
<span class="muted">BMI</span>

</div>

<b id="targetTdee">— kcal</b>
</div>

</div>

</section>


<!-- ==================== 個人資料 ==================== -->

<section class="card">

<h2>⚙️ 我的資料</h2>

<div class="row">

<div>
<label>身高 cm</label>
<input
id="height"
type="number"
step="any">
</div>

<div>
<label>體重 kg</label>
<input
id="weight"
type="number"
step="any">
</div>

</div>


<div class="row">

<div>
<label>年齡</label>
<input
id="age"
type="number">
</div>

<div>

<label>性別</label>

<select id="sex">

<option value="female">
女性
</option>

<option value="male">
男性
</option>

</select>

</div>

</div>


<label>
活動量
</label>

<select id="activity">

<option value="1.2">
久坐／很少運動 ×1.2
</option>

<option value="1.375">
輕度活動 ×1.375
</option>

<option value="1.55">
中度活動 ×1.55
</option>

<option value="1.725">
高度活動 ×1.725
</option>

</select>


<label>
TDEE 計算模式 (熱量目標)
</label>

<select id="tdeeGoal">

<option value="normal">
一般維持 (100% TDEE)
</option>

<option value="lose300">

</option>

<option value="lose500">
積極減重 (TDEE - 500 kcal)
</option>

<option value="lose15">
輕度減重 (85% TDEE)
</option>

</select>


<div class="row">

<div>
<label>目標體重 kg</label>

<input
id="goal"
type="number"
step="any">
</div>

<div>

<label>
今日日期
</label>

<input
id="date"
type="date">

</div>

</div>


<div class="actions">

<button
class="btn"
id="saveBtn"
onclick="saveProfile()">

<button
class="btn light"
id="resetBtn"

class="btn secondary"
id="editBtn"

style="display:none">

</button>

</section>

<script>

/* =========================================================
   基本資料
========================================================= */

const KEY = "bodyTrackerV2";

const DEFAULT_DATA = {
  profile:{},
  profileSaved:false,
  meals:[],
  weights:[],
  customFoods:[]
};

let data;


/* 防止 localStorage 壞掉造成整個網頁不能開 */

try{

  const saved =
    localStorage.getItem(KEY);

  data =
    saved
      ? JSON.parse(saved)
      : JSON.parse(JSON.stringify(DEFAULT_DATA));

}catch(e){

  data =
    JSON.parse(JSON.stringify(DEFAULT_DATA));

}


/* 舊資料補齊 */

if(!data.profile)
  data.profile={};

if(!data.meals)
  data.meals=[];

if(!data.weights)
  data.weights=[];

if(!data.customFoods)
  data.customFoods=[];


/* =========================================================
   工具
========================================================= */

const $ =
id => document.getElementById(id);


function today(){

  const d = new Date();

  const year =
    d.getFullYear();

  const month =
    String(d.getMonth()+1).padStart(2,"0");

  const day =
    String(d.getDate()).padStart(2,"0");

  return `${year}-${month}-${day}`;

}


function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}


/* =========================================================
   初始化
========================================================= */

$("date").value = today();

$("logDate").value = today();

autoSelectMealType();


[
  "height",
  "weight",
  "age",
  "sex",
  "activity",
  "tdeeGoal",
  "goal"
].forEach(id=>{

  $(id).addEventListener(
    "input",
    ()=>{

      if(!data.profileSaved){

        syncProfileFromInput();

      }

      renderStats();

    }
  );

});


$("date").addEventListener(
  "change",
  renderStats
);


initFoodDB();


/* =========================================================
   個人資料
========================================================= */

function syncProfileFromInput(){

  data.profile = {

    height:$("height").value,

    weight:$("weight").value,

    age:$("age").value,

    sex:$("sex").value,

    activity:$("activity").value,

    tdeeGoal:$("tdeeGoal").value,

    goal:$("goal").value

  };

}


/* =========================================================
   自動選擇餐別
========================================================= */

function autoSelectMealType(){

  const hour =
    new Date().getHours();

  let meal;


  if(hour >= 5 && hour < 11){

    meal="早餐";

  }

  else if(hour >= 11 && hour < 14){

    meal="午餐";

  }

  else if(hour >= 14 && hour < 17){

    meal="點心／飲料";

  }

  else if(hour >= 17 && hour < 21){

    meal="晚餐";

  }

  else{

    meal="點心／飲料";

  }


  $("mealType").value =
    meal;

}


/* =========================================================
   TDEE
========================================================= */

function calc(){

  const h =
    parseFloat($("height").value);

  const w =
    parseFloat($("weight").value);

  const a =
    parseFloat($("age").value);


  if(
    !isFinite(h) ||
    !isFinite(w) ||
    !isFinite(a) ||
    h<=0 ||
    w<=0 ||
    a<=0
  ){

    return null;

  }


  const bmi =
    w / ((h/100)**2);


  let bmr;


  if($("sex").value==="female"){

    bmr =
      10*w +
      6.25*h -
      5*a -
      161;

  }

  else{

    bmr =
      10*w +
      6.25*h -
      5*a +
      5;

  }


  const activity =
    parseFloat($("activity").value);


  const normalTdee =
    bmr * activity;


  let targetTdee =
    normalTdee;


  const mode =
    $("tdeeGoal").value;


  if(mode==="lose300"){

    targetTdee =
      Math.max(
        bmr,
        normalTdee-300
      );

  }


  else if(mode==="lose500"){

    targetTdee =
      Math.max(
        bmr,
        normalTdee-500
      );

  }


  else if(mode==="lose15"){

    targetTdee =
      Math.max(
        bmr,
        normalTdee*0.85
      );

  }


  return {

    bmi,
    bmr,
    normalTdee,
    targetTdee

  };

}


/* =========================================================
   鎖定 / 解鎖個人資料
========================================================= */

function setProfileInputsDisabled(
  disabled
){

  [
    "height",
    "weight",
    "age",
    "sex",
    "activity",
    "tdeeGoal",
    "goal"
  ].forEach(id=>{

    $(id).disabled =
      disabled;

  });


  if(disabled){

    $("saveBtn").style.display =
      "none";

    $("resetBtn").style.display =
      "none";

    $("editBtn").style.display =
      "inline-block";

  }

  else{

    $("saveBtn").style.display =
      "inline-block";

    $("resetBtn").style.display =
      "inline-block";

    $("editBtn").style.display =
      "none";

  }

}


/* =========================================================
   顯示統計
========================================================= */

function renderStats(){

  const p =
    data.profile || {};

  const c =
    calc();


  if(p.weight){

    $("w").textContent =
      `${parseFloat(p.weight).toFixed(1)} kg`;

  }

  else{

    $("w").textContent =
      "— kg";

  }


  $("bmi").textContent =
    c
      ? c.bmi.toFixed(1)
      : "—";


  $("tdee").textContent =
    c
      ? Math.round(c.normalTdee)+" kcal"
      : "— kcal";


  $("targetTdee").textContent =
    c
      ? Math.round(c.targetTdee)+" kcal"
      : "— kcal";


  const date =
    $("date").value || today();


  const meals =
    data.meals.filter(
      x=>x.date===date
    );


  const total =
    meals.reduce(
      (sum,x)=>sum + Number(x.cal),
      0
    );


  $("todayCal").textContent =
    `${total} kcal`;


  if(c){

    const remain =
      Math.round(
        c.targetTdee-total
      );


    $("remain").textContent =
      `目標 ${Math.round(c.targetTdee)} kcal (剩餘 ${remain} kcal)`;


    $("bar").style.width =
      Math.min(
        100,
        Math.max(
          0,
          total/c.targetTdee*100
        )
      )+"%";


    $("tdeeTip").textContent =
      `目前模式：${
        $("tdeeGoal")
        .options[
          $("tdeeGoal").selectedIndex
        ].text
      }。`;

  }

  else{

    $("remain").textContent =
      "請先填資料";

    $("bar").style.width =
      "0%";

    $("tdeeTip").textContent =
      "以 TDEE 作為參考，不代表醫療上的減重處方。";

  }


  if(meals.length){

    $("meals").innerHTML =
      meals.map(
        meal=>{

          const index =
            data.meals.indexOf(meal);


          return `

          <div class="meal">

            <div>

              <b>
                ${escapeHtml(meal.type)}
                ·
                ${meal.cal} kcal
              </b>

              <small>
                ${escapeHtml(meal.food || "未填食物")}
              </small>

            </div>


            <button
              class="del"
              onclick="delMeal(${index})">

              刪除

            </button>

          </div>

          `;

        }
      ).join("");

  }

  else{

    $("meals").innerHTML =
      '<div class="empty">今天還沒有飲食紀錄</div>';

  }


  draw();

}


/* =========================================================
   安全顯示文字
========================================================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      char=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[char])
    );

}


/* =========================================================
   render
========================================================= */

function render(){

  const p =
    data.profile || {};


  if(p.height)
    $("height").value =
      p.height;

  if(p.weight)
    $("weight").value =
      p.weight;

  if(p.age)
    $("age").value =
      p.age;

  $("sex").value =
    p.sex || "female";


  $("activity").value =
    p.activity || "1.2";


  $("tdeeGoal").value =
    p.tdeeGoal || "normal";


  if(p.goal)
    $("goal").value =
      p.goal;


  setProfileInputsDisabled(
    !!data.profileSaved
  );


  renderStats();

  save();

}


/* =========================================================
   儲存資料
========================================================= */

function saveProfile(){

  const h =
    $("height").value;

  const w =
    $("weight").value;

  const a =
    $("age").value;


  if(!h || !w || !a){

    alert(
      "請先完整填寫身高、體重與年齡！"
    );

    return;

  }


  syncProfileFromInput();

  data.profileSaved =
    true;


  setProfileInputsDisabled(
    true
  );


  save();

  renderStats();

}


/* =========================================================
   編輯
========================================================= */

function editProfile(){

  data.profileSaved =
    false;

  setProfileInputsDisabled(
    false
  );

  save();

}

const FOOD_DB = [

let apiFoodCache = [];

let searchTimer = null;


/* =========================================================
   取得全部食物
========================================================= */

function getAllFoods(){

  return [

    ...data.customFoods,

    ...FOOD_DB,

    ...apiFoodCache

  ];

}


/* =========================================================
   商店樣式
========================================================= */

function getStoreClass(store){

  if(store.includes("7-ELEVEN"))
    return "seven";

  if(store.includes("全家"))
    return "family";

  if(store.includes("萊爾富"))
    return "hilife";

  if(store.includes("自訂"))
    return "custom";

  if(store.includes("線上"))
    return "api";

  return "";

}


/* =========================================================
   初始化搜尋
========================================================= */

function initFoodDB(){

  const input =
    $("food");

  const box =
    $("foodSuggest");


  input.addEventListener(
    "focus",
    ()=>{

      renderFoodSuggestions(
        input.value
      );

    }
  );


  input.addEventListener(
    "input",
    autoFoodCal
  );


  input.addEventListener(
    "keydown",
    event=>{

      if(event.key==="Escape"){

        box.hidden =
          true;

        return;

      }


      if(event.key==="Enter"){

        const first =
          box.querySelector(
            ".food-option[data-cal]"
          );


        if(first){

          event.preventDefault();

          selectFoodItem(

            first.dataset.name,

            parseFloat(
              first.dataset.cal
            ),

            first.dataset.store

          );

        }

      }

    }
  );


  document.addEventListener(
    "click",
    event=>{

      if(
        !event.target.closest(
          ".food-search"
        )
      ){

        box.hidden =
          true;

      }

    }
  );

}


/* =========================================================
   顯示搜尋結果
========================================================= */

function renderFoodSuggestions(
  query
){

  const box =
    $("foodSuggest");


  const q =
    String(query || "")
      .trim()
      .toLowerCase();


  const all =
    getAllFoods();


  let list =
    all.filter(food=>{

      return (

        !q ||

        food.name
          .toLowerCase()
          .includes(q) ||

        food.store
          .toLowerCase()
          .includes(q)

      );

    });


  /*
    自訂食物放最前面，
    讓你自己新增過的食物更容易找到
  */

  list.sort((a,b)=>{

    const ac =
      a.name.toLowerCase()===q ? 0 :
      a.name.toLowerCase().startsWith(q) ? 1 : 2;

    const bc =
      b.name.toLowerCase()===q ? 0 :
      b.name.toLowerCase().startsWith(q) ? 1 : 2;

    return ac-bc;

  });


  list =
    list.slice(0,50);


  if(!list.length){

    box.innerHTML = `

      <div class="food-option">

        <small>
          找不到內建商品。
          你可以直接輸入食物名稱與熱量，
          加入後系統會自動記住。
        </small>

      </div>

    `;

  }

  else{

    box.innerHTML =

      list.map(food=>`

        <div

          class="food-option"

          data-name="${escapeAttr(food.name)}"

          data-cal="${food.cal}"

          data-store="${escapeAttr(food.store)}"

        >

          <div>

            <b>

              <span
                class="store-tag ${getStoreClass(food.store)}"
              >
                ${escapeHtml(food.store)}
              </span>

              ${escapeHtml(food.name)}

            </b>

          </div>

          <small>

            <b>
              ${food.cal}
            </b>

            kcal

          </small>

        </div>

      `).join("");

  }


  box.hidden =
    false;


  box
    .querySelectorAll(
      ".food-option[data-cal]"
    )
    .forEach(option=>{

      option.addEventListener(
        "mousedown",
        event=>{
          event.preventDefault();
        }
      );


      option.addEventListener(
        "click",
        ()=>{

          selectFoodItem(

            option.dataset.name,

            parseFloat(
              option.dataset.cal
            ),

            option.dataset.store

          );

        }
      );

    });

}


/* =========================================================
   HTML attribute escape
========================================================= */

function escapeAttr(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* =========================================================
   選擇食物
========================================================= */

function selectFoodItem(
  name,
  cal,
  store
){

  $("food").value =
    name;


  $("cal").value =
    cal;


  $("foodMatch").textContent =
    `✓ ${store}｜${name} (${cal} kcal)`;


  $("foodSuggest").hidden =
    true;

}


/* =========================================================
   自動帶熱量 + 搜尋
========================================================= */

function autoFoodCal(){

  const q =
    $("food").value
      .trim()
      .toLowerCase();


  if(!q){

    $("foodMatch").textContent =
      "";

    $("foodSuggest").hidden =
      true;

    return;

  }


  renderFoodSuggestions(
    q
  );


  const exact =
    getAllFoods().find(
      food=>
        food.name
          .toLowerCase()===q
    );


  if(exact){

    $("cal").value =
      exact.cal;


    $("foodMatch").textContent =
      `✓ ${exact.store}｜${exact.name} (${exact.cal} kcal)`;

  }

  else{

    $("foodMatch").textContent =
      "";

  }


  clearTimeout(
    searchTimer
  );


  if(q.length>=2){

    searchTimer =
      setTimeout(
        ()=>fetchOpenFoodFacts(q),
        600
      );

  }

}


/* =========================================================
   Open Food Facts
========================================================= */

async function fetchOpenFoodFacts(
  query
){

  try{

    const url =
      `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=8`;


    const response =
      await fetch(url);


    if(!response.ok)
      throw new Error(
        "API request failed"
      );


    const apiData =
      await response.json();


    apiFoodCache =
      (apiData.products || [])
        .map(product=>{

          const name =
            product.product_name_tw ||
            product.product_name_zh ||
            product.product_name ||
            "未知食品";


          const kcal100g =
            product.nutriments
              ?.["energy-kcal_100g"];


          const kcal =
            product.nutriments
              ?.["energy-kcal"];


          const finalCal =
            Math.round(
              kcal100g ||
              kcal ||
              0
            );


          return {

            store:"線上 API",

            name:name,

            cal:finalCal

          };

        })
        .filter(
          food=>food.cal>0
        );


    if(
      $("food").value
        .trim()
        .toLowerCase()
      ===
      query.toLowerCase()
    ){

      renderFoodSuggestions(
        query
      );

    }

  }

  catch(error){

    console.log(
      "Open Food Facts 查詢失敗",
      error
    );

  }

}


/* =========================================================
   新增一餐
========================================================= */

function addMeal(){

  const cal =
    parseFloat(
      $("cal").value
    );


  const foodName =
    $("food").value.trim();


  if(
    !isFinite(cal) ||
    cal<=0
  ){

    alert(
      "請輸入正確熱量數值"
    );

    return;

  }


  if(foodName){

    const exists =
      getAllFoods().some(
        food=>
          food.name
            .toLowerCase()
          ===
          foodName.toLowerCase()
      );


    if(!exists){

      data.customFoods.unshift({

        store:"自訂記憶",

        name:foodName,

        cal:cal

      });

    }

  }


  data.meals.push({

    date:
      $("date").value ||
      today(),

    type:
      $("mealType").value,

    cal:cal,

    food:
      foodName ||
      "未填名稱"

  });


  $("food").value =
    "";

  $("cal").value =
    "";

  $("foodMatch").textContent =
    "";

  $("foodSuggest").hidden =
    true;


  save();

  renderStats();

}

   刪除一餐
========================================================= */

function delMeal(index){

  data.meals.splice(
    index,

}


/* =========================================================
   體重紀錄
========================================================= */

function addWeight(){

  const weight =
    parseFloat(
      $("logWeight").value
    );


  if(
    !isFinite(weight) ||
    weight<=0
  ){

    alert(
      "請輸入正確體重數字"
    );

    return;

  }


  const date =
    $("logDate").value ||
    today();


  data.weights.push({

    date:date,

    weight:weight

  });


  /* 同一天只保留最後一次 */

  data.weights =
    data.weights.filter(
      (item,index,array)=>{

        if(
          item.date!==date
        ){

          return true;

        }


        return (
          index ===
          array.length-1
        );

      }
    );


  data.weights.sort(
    (a,b)=>
      a.date.localeCompare(
        b.date
      )
  );


  /* 同步目前體重 */

  $("weight").value =
    weight;


  data.profile.weight =
    weight;


  if(!data.profileSaved){

    syncProfileFromInput();

  }


  $("logWeight").value =
    "";


  save();

  renderStats();

}


/* =========================================================
   體重曲線
========================================================= */

function draw(){

  const canvas =
    $("chart");


  const ctx =
    canvas.getContext("2d");


  const dpr =
    window.devicePixelRatio ||
    1;


  const width =
    canvas.clientWidth;


  const height =
    canvas.clientHeight;


  canvas.width =
    width*dpr;


  canvas.height =
    height*dpr;


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  const arr =
    data.weights.slice(-14);


  if(arr.length<2){

    ctx.fillStyle =
      "#999";

    ctx.font =
      "13px sans-serif";


    ctx.fillText(
      "記錄至少 2 次體重後會顯示趨勢曲線",
      16,
      35
    );

    return;

  }


  const values =
    arr.map(
      item=>item.weight
    );


  const min =
    Math.min(...values)-1;


  const max =
    Math.max(...values)+1;


  const usableWidth =
    width-40;


  const usableHeight =
    height-40;


  ctx.strokeStyle =
    "#222";

  ctx.lineWidth =
    2;

  ctx.beginPath();


  arr.forEach(
    (item,index)=>{

      const x =
        20 +
        index *
        usableWidth /
        (arr.length-1);


      const y =
        15 +
        (max-item.weight) /
        (max-min) *
        usableHeight;


      if(index===0){

        ctx.moveTo(
          x,
          y
        );

      }

      else{

        ctx.lineTo(
          x,
          y
        );

      }

    }
  );


  ctx.stroke();


  ctx.fillStyle =
    "#222";


  arr.forEach(
    (item,index)=>{

      const x =
        20 +
        index *
        usableWidth /
        (arr.length-1);


      const y =
        15 +
        (max-item.weight) /
        (max-min) *
        usableHeight;


      ctx.beginPath();

      ctx.arc(
        x,
        y,
        4,
        0,
        Math.PI*2
      );

      ctx.fill();

    }
  );


  ctx.fillStyle =
    "#777";

  ctx.font =
    "11px sans-serif";


  ctx.fillText(
    values[0].toFixed(1)+" kg",
    8,
    15
  );


  ctx.fillText(
    values[values.length-1]
      .toFixed(1)+" kg",
    Math.max(
      8,
      width-60
    ),
    height-8
  );

}
