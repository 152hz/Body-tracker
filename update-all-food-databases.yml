name: Update all food databases v5

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 0"

permissions:
  contents: write

concurrency:
  group: update-all-food-databases
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pandas

      - name: Build food databases
        run: |
          python - <<'PY'
          import json
          import io
          import re
          import zipfile
          import requests
          import pandas as pd
          from bs4 import BeautifulSoup

          HEADERS = {
              "User-Agent": "Mozilla/5.0"
          }

          def norm(v):
              if v is None:
                  return ""
              return str(v).strip()

          def num(v):
              if v is None:
                  return None
              s = str(v).replace(",", "").strip()
              m = re.search(r"-?\d+(?:\.\d+)?", s)
              if not m:
                  return None
              try:
                  return float(m.group())
              except:
                  return None

          # =========================================================
          # TFDA 食品營養成分資料庫
          # =========================================================
          print("Downloading TFDA data...")

          tfda_url = "https://data.fda.gov.tw/data/opendata/export/20/csv"
          r = requests.get(tfda_url, headers=HEADERS, timeout=60)
          r.raise_for_status()

          z = zipfile.ZipFile(io.BytesIO(r.content))
          csv_name = z.namelist()[0]

          with z.open(csv_name) as f:
              raw = f.read()

          text = None
          for enc in ["utf-8-sig", "utf-8", "cp950", "big5"]:
              try:
                  text = raw.decode(enc)
                  break
              except:
                  pass

          if text is None:
              raise RuntimeError("Cannot decode TFDA CSV")

          df = pd.read_csv(io.StringIO(text))

          print("TFDA columns:", list(df.columns))

          def col_contains(words):
              for c in df.columns:
                  cc = str(c)
                  if all(w in cc for w in words):
                      return c
              return None

          food_col = (
              col_contains(["樣品名稱"])
              or col_contains(["食品名稱"])
              or col_contains(["名稱"])
          )

          alias_col = col_contains(["俗名"]) or col_contains(["別名"])
          cat_col = col_contains(["食品分類"]) or col_contains(["分類"])
          nutrient_col = col_contains(["分析項"])
          value_col = col_contains(["每100克"]) or col_contains(["每100公克"])

          tfda_map = {}

          if food_col and nutrient_col and value_col:
              for _, row in df.iterrows():
                  name = norm(row.get(food_col))
                  if not name:
                      continue

                  alias = norm(row.get(alias_col)) if alias_col else ""
                  cat = norm(row.get(cat_col)) if cat_col else ""

                  key = name
                  if key not in tfda_map:
                      tfda_map[key] = {
                          "name": name,
                          "aliases": [alias] if alias else [],
                          "category": cat,
                          "source": "TFDA",
                          "per100g": True,
                          "calories": None,
                          "protein": None,
                          "carbs": None,
                          "fat": None
                      }

                  nutrient = norm(row.get(nutrient_col))
                  value = num(row.get(value_col))

                  if value is None:
                      continue

                  if "熱量" in nutrient:
                      tfda_map[key]["calories"] = value
                  elif "粗蛋白" in nutrient or "蛋白質" in nutrient:
                      tfda_map[key]["protein"] = value
                  elif "總碳水化合物" in nutrient or "碳水化合物" in nutrient:
                      tfda_map[key]["carbs"] = value
                  elif "粗脂肪" in nutrient or "脂肪" in nutrient:
                      tfda_map[key]["fat"] = value

          tfda_foods = [
              x for x in tfda_map.values()
              if x["calories"] is not None
          ]

          with open("tfda-foods.json", "w", encoding="utf-8") as f:
              json.dump(tfda_foods, f, ensure_ascii=False, indent=2)

          print("TFDA foods:", len(tfda_foods))

          # =========================================================
          # 臺北市食材登錄平台
          # 抓公開頁面中可取得的品牌、產品、份量、熱量
          # =========================================================

          BASE = "https://foodtracer.taipei.gov.tw"

          category_urls = [
              # 西式連鎖速食
              f"{BASE}/Front/Restaurant/List?mid=e85a79c7-cd54-4aa5-9719-c8a9d0e575ce&fid=26dba213-3227-4c44-a65b-d7f59abf2d35",

              # 連鎖飲冰品
              f"{BASE}/Front/Restaurant/List?mid=e85a79c7-cd54-4aa5-9719-c8a9d0e575ce&fid=c5e8fab7-daed-4ae3-98f6-4919b1487c00",

              # 其他專區由首頁自動探索
              f"{BASE}/Front/Home"
          ]

          session = requests.Session()
          session.headers.update(HEADERS)

          seen_urls = set()
          restaurant_urls = set()
          taipei_foods = []

          def abs_url(href):
              if not href:
                  return None
              if href.startswith("http"):
                  return href
              if href.startswith("/"):
                  return BASE + href
              return BASE + "/" + href.lstrip("/")

          def discover_restaurant_links(url):
              try:
                  resp = session.get(url, timeout=25)
                  resp.raise_for_status()
              except Exception as e:
                  print("skip list:", url, e)
                  return

              soup = BeautifulSoup(resp.text, "lxml")

              for a in soup.find_all("a", href=True):
                  href = a["href"]
                  full = abs_url(href)
                  if not full:
                      continue

                  # 常見餐廳/品牌內容頁
                  if (
                      "/Front/Restaurant/" in full
                      or "/Front/Product/" in full
                      or "RestaurantDetail" in full
                  ):
                      restaurant_urls.add(full)

                  # 其他可探索的專區列表
                  if "fid=" in full and "/Front/" in full:
                      if full not in seen_urls:
                          seen_urls.add(full)

          for url in category_urls:
              discover_restaurant_links(url)

          # 從首頁發現的其他專區再抓一輪
          extra = list(seen_urls)[:80]
          for url in extra:
              discover_restaurant_links(url)

          print("Potential Taipei pages:", len(restaurant_urls))

          def text_of(el):
              if not el:
                  return ""
              return " ".join(el.stripped_strings)

          for i, url in enumerate(list(restaurant_urls)[:500]):
              try:
                  resp = session.get(url, timeout=20)
                  if resp.status_code != 200:
                      continue
              except:
                  continue

              soup = BeautifulSoup(resp.text, "lxml")
              page_text = text_of(soup)

              brand = ""
              for sel in ["h1", "h2", ".title", ".brand", ".restaurant-name"]:
                  el = soup.select_one(sel)
                  if el:
                      brand = text_of(el)
                      if brand:
                          break

              # 嘗試解析 table
              for table in soup.find_all("table"):
                  rows = table.find_all("tr")

                  headers = []
                  if rows:
                      headers = [text_of(x) for x in rows[0].find_all(["th", "td"])]

                  for tr in rows[1:]:
                      cells = [text_of(x) for x in tr.find_all(["th", "td"])]
                      if len(cells) < 2:
                          continue

                      joined = " | ".join(cells)

                      # 至少要有看起來像熱量資訊
                      if "熱量" not in joined and "大卡" not in joined and "kcal" not in joined.lower():
                          continue

                      name = cells[0].strip()
                      if not name or len(name) > 100:
                          continue

                      calories = None
                      serving = ""

                      for c in cells[1:]:
                          if calories is None and (
                              "大卡" in c
                              or "kcal" in c.lower()
                              or re.fullmatch(r"\d+(?:\.\d+)?", c.strip())
                          ):
                              val = num(c)
                              if val is not None and 0 < val < 5000:
                                  calories = val

                          if ("克" in c or "毫升" in c or "ml" in c.lower()) and len(c) < 50:
                              serving = c

                      if calories is None:
                          continue

                      taipei_foods.append({
                          "name": name,
                          "brand": brand,
                          "store": brand,
                          "calories": calories,
                          "serving": serving,
                          "source": "臺北市食材登錄平台"
                      })

              if i % 25 == 0:
                  print("Taipei parsed:", i)

          # 去重
          dedup = {}
          for x in taipei_foods:
              key = (
                  norm(x.get("brand")).lower(),
                  norm(x.get("name")).lower(),
                  x.get("calories")
              )
              dedup[key] = x

          taipei_foods = list(dedup.values())

          with open("taipei-foods.json", "w", encoding="utf-8") as f:
              json.dump(taipei_foods, f, ensure_ascii=False, indent=2)

          print("Taipei foods:", len(taipei_foods))

          # 保留舊版 fastfood / drink 檔，避免前端相容性壞掉
          fast_words = [
              "麥當勞", "肯德基", "漢堡王", "摩斯", "MOS",
              "SUBWAY", "必勝客", "達美樂", "拿坡里",
              "頂呱呱", "21PLUS", "21風味館"
          ]

          drink_words = [
              "50嵐", "CoCo", "麻古", "清心", "迷客夏",
              "可不可", "龜記", "珍煮丹", "茶湯會",
              "大苑子", "COMEBUY", "五桐號", "得正"
          ]

          fastfoods = []
          drinks = []

          for x in taipei_foods:
              txt = (
                  str(x.get("brand", ""))
                  + " "
                  + str(x.get("name", ""))
              ).lower()

              if any(w.lower() in txt for w in fast_words):
                  fastfoods.append(x)

              if any(w.lower() in txt for w in drink_words):
                  drinks.append(x)

          with open("fastfood-foods.json", "w", encoding="utf-8") as f:
              json.dump(fastfoods, f, ensure_ascii=False, indent=2)

          with open("drink-shop-foods.json", "w", encoding="utf-8") as f:
              json.dump(drinks, f, ensure_ascii=False, indent=2)

          print("fastfood:", len(fastfoods))
          print("drink:", len(drinks))

          PY

      - name: Save generated databases
        run: |
          mkdir -p "$RUNNER_TEMP/fooddb"
          cp tfda-foods.json "$RUNNER_TEMP/fooddb/"
          cp taipei-foods.json "$RUNNER_TEMP/fooddb/"
          cp fastfood-foods.json "$RUNNER_TEMP/fooddb/"
          cp drink-shop-foods.json "$RUNNER_TEMP/fooddb/"

      - name: Commit updated databases retry safe
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5
          do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            cp "$RUNNER_TEMP/fooddb/tfda-foods.json" .
            cp "$RUNNER_TEMP/fooddb/taipei-foods.json" .
            cp "$RUNNER_TEMP/fooddb/fastfood-foods.json" .
            cp "$RUNNER_TEMP/fooddb/drink-shop-foods.json" .

            git add \
              tfda-foods.json \
              taipei-foods.json \
              fastfood-foods.json \
              drink-shop-foods.json

            if git diff --cached --quiet
            then
              echo "No changes"
              exit 0
            fi

            git commit -m "Update food databases"

            if git push origin HEAD:main
            then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push conflict, retrying..."
            sleep 5
          done

          echo "Push failed after retries"
          exit 1
