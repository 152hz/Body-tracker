<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的體態紀錄</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f6f5f2;color:#272727}
.app{max-width:760px;margin:auto;padding:20px 16px 90px}
.hero{background:#222;color:#fff;border-radius:28px;padding:24px 22px;margin-bottom:14px}
h1{margin:0 0 5px;font-size:28px}
.muted{opacity:.68;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.stat{background:#ffffff12;border-radius:18px;padding:14px}
.stat b{display:block;font-size:20px;margin-top:3px}
.card{background:white;border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 3px 15px #00000008}
h2{font-size:18px;margin:0 0 14px}
input,select,button{font:inherit}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:13px;background:#fff}
input:disabled,select:disabled{background:#f0f0f0;color:#666;cursor:not-allowed}
.food-wrap{position:relative}
.hint{font-size:11px;color:#888;margin-top:5px}
.food-match{font-size:12px;color:#555;margin-top:6px;min-height:16px}
label{font-size:12px;color:#777;display:block;margin:9px 0 5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 15px;background:#222;color:white;cursor:pointer;font-weight:600}
.btn.light{background:#eee;color:#222}
.btn.secondary{background:#4a5568;color:white}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .btn{flex:1}
.progress{height:13px;background:#eee;border-radius:20px;overflow:hidden}
.bar{height:100%;width:0;background:#222;border-radius:20px;transition:.3s}
.meal{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.meal:last-child{border:0}
.meal small{color:#888;display:block}
.del{border:0;background:#f1f1f1;border-radius:9px;padding:5px 8px;cursor:pointer}
.food-search{position:relative}
.food-suggest{position:absolute;z-index:999;left:0;right:0;top:100%;background:#fff;border:1px solid #ddd;border-radius:12px;margin-top:5px;max-height:280px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.food-option{padding:11px 13px;border-bottom:1px solid #eee;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.food-option:hover{background:#f8f8f8}
.food-option:last-child{border-bottom:0}
.food-option b{display:block;font-size:14px}
.food-option small{color:#777}
.store-tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;background:#e2e8f0;color:#2d3748;margin-right:6px;font-weight:bold}
.store-tag.seven{background:#feebc8;color:#c05621}
.store-tag.family{background:#c3dafe;color:#2c5282}
.store-tag.hilife{background:#fed7d7;color:#9b2c2c}
.store-tag.custom{background:#c6f6d5;color:#22543d}
.store-tag.api{background:#e9d8fd;color:#553c9a}
#chart{width:100%;height:180px;background:#fafafa;border-radius:16px}
.empty{text-align:center;color:#999;padding:20px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<section class="hero">
  <div class="muted">PERSONAL BODY TRACKER</div>
  <h1>我的體態紀錄 🐷</h1>
  <div class="muted">把每天的體重與吃的東西記下來</div>
  <div class="grid">
    <div class="stat"><span class="muted">目前體重</span><b id="w">— kg</b></div>
    <div class="stat"><span class="muted">BMI</span><b id="bmi">—</b></div>
    <div class="stat"><span class="muted">一般 TDEE</span><b id="tdee">— kcal</b></div>
    <div class="stat"><span class="muted">目標 TDEE</span><b id="targetTdee">— kcal</b></div>
  </div>
</section>

<section class="card">
<h2>⚙️ 我的資料</h2>
<div class="row">
<div><label>身高 cm</label><input id="height" type="number" step="any"></div>
<div><label>體重 kg</label><input id="weight" type="number" step="any"></div>
</div>
<div class="row">
<div><label>年齡</label><input id="age" type="number"></div>
<div><label>性別</label><select id="sex"><option value="female">女性</option><option value="male">男性</option></select></div>
</div>
<label>活動量</label>
<select id="activity">
<option value="1.2">久坐／很少運動 ×1.2</option>
<option value="1.375">輕度活動 ×1.375</option>
<option value="1.55">中度活動 ×1.55</option>
<option value="1.725">高度活動 ×1.725</option>
</select>

<label>TDEE 計算模式 (熱量目標)</label>
<select id="tdeeGoal">
<option value="normal">一般維持 (100% TDEE)</option>
<option value="lose300">溫和減重 (TDEE - 300 kcal)</option>
<option value="lose500">積極減重 (TDEE - 500 kcal)</option>
<option value="lose15">輕度減重 (85% TDEE)</option>
</select>

<div class="row">
<div><label>目標體重 kg</label><input id="goal" type="number" step="any"></div>
<div><label>今日日期</label><input id="date" type="date"></div>
</div>
<div class="actions" id="profileActions">
  <button class="btn" id="saveBtn" onclick="saveProfile()">💾 儲存資料</button>
  <button class="btn light" id="resetBtn" onclick="resetAll()">清除全部</button>
  <button class="btn secondary" id="editBtn" onclick="editProfile()" style="display:none;">✏️ 編輯資料</button>
</div>
</section>

<section class="card">
<h2>🎯 今日熱量</h2>
<div style="display:flex;justify-content:space-between;margin-bottom:9px">
  <b id="todayCal">0 kcal</b>
  <span class="muted" id="remain">TDEE —</span>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<p class="muted" style="margin-top:8px;margin-bottom:0" id="tdeeTip">以 TDEE 作為參考，不代表醫療上的減重處方。</p>
</section>

<section class="card">
<h2>🍱 新增一餐</h2>
<div class="row">
<div>
  <label>餐別</label>
  <select id="mealType">
    <option value="早餐">早餐</option>
    <option value="午餐">午餐</option>
    <option value="晚餐">晚餐</option>
    <option value="點心／飲料">點心／飲料</option>
  </select>
</div>
<div><label>熱量 kcal (可手動修改)</label><input id="cal" type="number" min="0" step="any"></div>
</div>
<label>吃了什麼</label>
<div class="food-search">
  <input id="food" autocomplete="off" placeholder="搜尋超商、線上食品 API 或輸入自訂食物">
  <div id="foodSuggest" class="food-suggest" hidden></div>
  <div id="foodMatch" class="food-match"></div>
</div>
<div class="hint">💡 支援超商內建資料、Open Food Facts 線上 API。手動新增過的新商品會自動學習並儲存！</div>
<div class="actions"><button class="btn" onclick="addMeal()">＋ 加入紀錄</button></div>
<div id="meals"></div>
</section>

<section class="card">
<h2>⚖️ 體重紀錄</h2>
<div class="row">
  <div><label>日期</label><input id="logDate" type="date"></div>
  <div><label>體重 kg</label><input id="logWeight" type="number" step="any"></div>
</div>
<div class="actions"><button class="btn" onclick="addWeight()">＋ 記錄體重</button></div>
<canvas id="chart"></canvas>
</section>
</div>

<script>
const KEY="bodyTrackerV1";
let data=JSON.parse(localStorage.getItem(KEY)|||'{"profile":{},"profileSaved":false,"meals":[],"weights":[],"customFoods":[]}');
if(!data.customFoods) data.customFoods = [];

const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);

$("date").value=today(); 
$("logDate").value=today(); 
autoSelectMealType();
initFoodDB(); 
$("food").addEventListener("input",autoFoodCal);

["height","weight","age","sex","activity","tdeeGoal","goal"].forEach(id=>{
  $(id).addEventListener("input",()=>{
    syncProfileFromInput();
    renderStats();
  });
});

function syncProfileFromInput(){
  data.profile = {
    height: $("height").value,
    weight: $("weight").value,
    age: $("age").value,
    sex: $("sex").value,
    activity: $("activity").value,
    tdeeGoal: $("tdeeGoal").value,
    goal: $("goal").value
  };
}

function autoSelectMealType(){
  const hour = new Date().getHours();
  let defaultMeal = "早餐";
  if(hour >= 5 && hour < 11) defaultMeal = "早餐";
  else if(hour >= 11 && hour < 14) defaultMeal = "午餐";
  else if(hour >= 14 && hour < 17) defaultMeal = "點心／飲料";
  else if(hour >= 17 && hour < 21) defaultMeal = "晚餐";
  else defaultMeal = "點心／飲料";
  $("mealType").value = defaultMeal;
}

function calc(){
 const h=+$("height").value, w=+$("weight").value, a=+$("age").value;
 if(!h||!w||!a) return null;
 const bmi=w/((h/100)**2);
 const bmr=$("sex").value==="female"?10*w+6.25*h-5*a-161:10*w+6.25*h-5*a+5;
 const normalTdee=bmr*(+$("activity").value);
 
 const mode = $("tdeeGoal").value || "normal";
 let targetTdee = normalTdee;
 if(mode === "lose300") targetTdee = Math.max(bmr, normalTdee - 300);
 else if(mode === "lose500") targetTdee = Math.max(bmr, normalTdee - 500);
 else if(mode === "lose15") targetTdee = Math.max(bmr, normalTdee * 0.85);

 return {bmi, bmr, normalTdee, targetTdee};
}

function setProfileInputsDisabled(disabled){
  ["height","weight","age","sex","activity","tdeeGoal","goal"].forEach(id=>{
    $(id).disabled = disabled;
  });
  if(disabled){
    $("saveBtn").style.display = "none";
    $("resetBtn").style.display = "none";
    $("editBtn").style.display = "inline-block";
  }else{
    $("saveBtn").style.display = "inline-block";
    $("resetBtn").style.display = "inline-block";
    $("editBtn").style.display = "none";
  }
}

function renderStats(){
 const p=data.profile || {};
 const c=calc();
 
 $("w").textContent=p.weight?`${(+p.weight).toFixed(1)} kg`:"— kg";
 $("bmi").textContent=c?c.bmi.toFixed(1):"—";
 $("tdee").textContent=c?Math.round(c.normalTdee)+" kcal":"— kcal";
 $("targetTdee").textContent=c?Math.round(c.targetTdee)+" kcal":"— kcal";

 const d=$("date").value||today();
 const ms=data.meals.filter(x=>x.date===d), total=ms.reduce((s,x)=>s+x.cal,0);
 $("todayCal").textContent=total+" kcal";
 
 if(c){
   const remainCal = Math.round(c.targetTdee - total);
   $("remain").textContent=`目標 ${Math.round(c.targetTdee)} kcal (剩餘 ${remainCal} kcal)`;
   $("bar").style.width=Math.min(100, (total / c.targetTdee) * 100)+"%";
   $("tdeeTip").textContent = `目前模式：${$("tdeeGoal").options[$("tdeeGoal").selectedIndex].text}。`;
 }else{
   $("remain").textContent="請先填資料";
   $("bar").style.width="0%";
   $("tdeeTip").textContent="以 TDEE 作為參考，不代表醫療上的減重處方。";
 }
 
 $("meals").innerHTML=ms.length?ms.map((x,i)=>`<div class="meal"><div><b>${x.type} · ${x.cal} kcal</b><small>${x.food||"未填食物"}</small></div><button class="del" onclick="delMeal(${data.meals.indexOf(x)})">刪除</button></div>`).join(""):'<div class="empty">今天還沒有飲食紀錄</div>';
 draw();
}

function render(){
 const p=data.profile||{};
 const loadVal=(id, val)=>{
   const el=$(id);
   if(el && document.activeElement!==el && val!==undefined && val!==null) el.value=val;
 };
 loadVal("height", p.height);
 loadVal("weight", p.weight);
 loadVal("age", p.age);
 loadVal("sex", p.sex||"female");
 loadVal("activity", p.activity||"1.2");
 loadVal("tdeeGoal", p.tdeeGoal||"normal");
 loadVal("goal", p.goal);

 setProfileInputsDisabled(!!data.profileSaved);
 renderStats();
 localStorage.setItem(KEY,JSON.stringify(data));
}

function saveProfile(){
 const h=$("height").value, w=$("weight").value, a=$("age").value;
 if(!h || !w || !a){
   alert("請先完整填寫身高、體重與年齡！");
   return;
 }
 syncProfileFromInput();
 data.profileSaved = true;
 setProfileInputsDisabled(true);
 renderStats();
 localStorage.setItem(KEY,JSON.stringify(data));
}

function editProfile(){
 data.profileSaved = false;
 setProfileInputsDisabled(false);
 localStorage.setItem(KEY,JSON.stringify(data));
}

// 基礎內建超商資料庫

let apiFoodCache = [];
let searchDebounceTimer = null;

function initFoodDB(){
  const input=$("food"), box=$("foodSuggest");
  input.addEventListener("input", ()=>{
    clearTimeout(searchDebounceTimer);
    const q = input.value.trim();
    renderFoodSuggestions(q);
    if(q.length >= 2){
      searchDebounceTimer = setTimeout(()=>fetchOpenFoodFacts(q), 400);
    }
  });
  input.addEventListener("focus", ()=>renderFoodSuggestions(input.value));
  input.addEventListener("keydown", e=>{
    if(e.key==="Escape"){box.hidden=true;return;}
    if(e.key==="Enter"){
      const first=box.querySelector(".food-option[data-cal]");
      if(first){
        e.preventDefault();
        selectFoodItem(first.dataset.name, +first.dataset.cal, first.dataset.store);
      }
    }
  });
  document.addEventListener("click", e=>{
    if(!e.target.closest(".food-search")) box.hidden=true;
  });
}

// 串接 Open Food Facts 開放資料 API
async function fetchOpenFoodFacts(query){
  try{
    const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=8`;
    const res = await fetch(url);
    const apiData = await res.json();
    if(apiData && apiData.products){
      apiFoodCache = apiData.products.map(p => {
        const name = p.product_name_tw || p.product_name_zh || p.product_name || "未知食品";
        const cal = p.nutriments ? Math.round(p.nutriments["energy-kcal_100g"] || p.nutriments["energy-kcal"] || 0) : 0;
        return { store: "線上 API", name: name, cal: cal };
      }).filter(x => x.cal > 0);
      renderFoodSuggestions(query);
    }
  }catch(e){
    console.log("API 查詢失敗或無網路 connection", e);
  }
}

function getStoreClass(store){
  if(store.includes("7-ELEVEN")) return "seven";
  if(store.includes("全家")) return "family";
  if(store.includes("萊爾富")) return "hilife";
  if(store.includes("自訂")) return "custom";
  if(store.includes("線上")) return "api";
  return "";
}

function getAllFoods(){
  return [...data.customFoods, ...FOOD_DB, ...apiFoodCache];
}

function renderFoodSuggestions(query){
  const box=$("foodSuggest"), q=(query||"").trim().toLowerCase();
  const allList = getAllFoods();
  
  let list=allList.filter(x=>!q || x.name.toLowerCase().includes(q) || x.store.toLowerCase().includes(q));
  list=list.slice(0,30);
  
  if(!list.length){
    box.innerHTML='<div class="food-option"><small>找不到商品？手動輸入熱量並新增，系統會自動儲存至智慧記憶庫！</small></div>';
  }else{
    box.innerHTML=list.map(x=>`
      <div class="food-option" data-name="${x.name}" data-cal="${x.cal}" data-store="${x.store}">
        <div>
          <b><span class="store-tag ${getStoreClass(x.store)}">${x.store}</span>${x.name}</b>
        </div>
        <small><b>${x.cal}</b> kcal</small>
      </div>
    `).join("");
  }
  box.hidden=false;
  box.querySelectorAll(".food-option[data-cal]").forEach(el=>{
    el.addEventListener("mousedown", e=>e.preventDefault());
    el.addEventListener("click", ()=>selectFoodItem(el.dataset.name, +el.dataset.cal, el.dataset.store));
  });
}

function selectFoodItem(name, cal, store){
  $("food").value=name;
  $("cal").value=cal;
  $("foodMatch").textContent=`✓ ${store}｜${name} (${cal} kcal)`;
  $("foodSuggest").hidden=true;
}

function autoFoodCal(){
 const q = $("food").value.trim().toLowerCase();
 if(!q){ $("foodMatch").textContent=""; return; }
 const f = getAllFoods().find(x=>x.name.toLowerCase()===q || x.name.toLowerCase().includes(q));
 if(f){
   $("cal").value=f.cal;
   $("foodMatch").textContent=`✓ ${f.store}｜${f.name} (${f.cal} kcal)`;
 }else{
   $("foodMatch").textContent="";
 }
}

function addMeal(){
  const cal=+$("cal").value;
  const foodName=$("food").value.trim();
  if(isNaN(cal) || cal <= 0) return alert("請輸入正確熱量數值");
  
  // 智慧記憶：如果這項食物不在內建或自訂庫中，自動學習並儲存！
  if(foodName){
    const exists = getAllFoods().some(x => x.name.toLowerCase() === foodName.toLowerCase());
    if(!exists){
      data.customFoods.unshift({ store: "自訂記憶", name: foodName, cal: cal });
    }
  }

  data.meals.push({
    date:$("date").value||today(),
    type:$("mealType").value,
    cal:cal,
    food:foodName||"未填名稱"
  });
  
  $("cal").value="";
  $("food").value="";
  $("foodMatch").textContent="";
  renderStats();
  localStorage.setItem(KEY,JSON.stringify(data));
}

function delMeal(i){
  data.meals.splice(i,1);
  renderStats();
  localStorage.setItem(KEY,JSON.stringify(data));
}

function addWeight(){
  const w=+$("logWeight").value;
  if(!w) return alert("請輸入正確體重數字");
  data.weights.push({date:$("logDate").value||today(), weight:w});
  data.weights.sort((a,b)=>a.date.localeCompare(b.date));
  $("weight").value=w;
  data.profile.weight=w;
  renderStats();
  localStorage.setItem(KEY,JSON.stringify(data));
  $("logWeight").value="";
}

function draw(){
 const c=$("chart"),ctx=c.getContext("2d"),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
 c.width=w*dpr; c.height=h*dpr; ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
 const arr=data.weights.slice(-14);
 if(arr.length<2){
   ctx.fillStyle="#999"; ctx.font="13px sans-serif";
   ctx.fillText("記錄至少 2 次體重後會顯示趨勢曲線",16,35);
   return;
 }
 const vals=arr.map(x=>x.weight), min=Math.min(...vals)-1, max=Math.max(...vals)+1;
 ctx.strokeStyle="#222"; ctx.lineWidth=2; ctx.beginPath();
 arr.forEach((x,i)=>{
   const px=20+i*(w-40)/(arr.length-1), py=15+(max-x.weight)/(max-min)*(h-40);
   i?ctx.lineTo(px,py):ctx.moveTo(px,py);
 });
 ctx.stroke();
 ctx.fillStyle="#222";
 arr.forEach((x,i)=>{
   const px=20+i*(w-40)/(arr.length-1), py=15+(max-x.weight)/(max-min)*(h-40);
   ctx.beginPath(); ctx.arc(px,py,4,0,7); ctx.fill();
 });
 ctx.fillStyle="#777"; ctx.font="11px sans-serif";
 ctx.fillText(vals[0].toFixed(1)+" kg",8,15);
 ctx.fillText(vals[vals.length-1].toFixed(1)+" kg",w-55,h-8);
}

function resetAll(){
  if(confirm("確定要清除所有個人資料與紀錄嗎？（包含自訂記憶食物）")){
    localStorage.removeItem(KEY);
    location.reload();
  }
}

render();
</script>
</body>
