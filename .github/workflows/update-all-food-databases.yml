name: Update all food databases v7 safe merge

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 0"

permissions:
  contents: write

concurrency:
  group: update-all-food-databases
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # 1. 下載完整 Git 歷史
      #    fetch-depth: 0 很重要
      #    因為 v7 會回頭找「以前筆數最多的 JSON」
      # ============================================================
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pandas

      # ============================================================
      # 3. 先從 Git 歷史救回「每個資料庫曾經最大的版本」
      #
      #    例如：
      #    fastfood 現在只有 10 筆
      #    但 Git 歷史以前有 300 筆
      #
      #    → v7 會用 300 筆當保護基底
      # ============================================================
      - name: Recover largest historical databases
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          FILES = [
              "convenience-foods.json",
              "fastfood-foods.json",
              "drink-shop-foods.json",
              "taipei-foods.json",
              "tfda-foods.json",
              "official-chain-foods.json",
          ]

          os.makedirs(".safe-baseline", exist_ok=True)

          def load_json_bytes(raw):
              try:
                  data = json.loads(raw.decode("utf-8-sig"))
                  return data if isinstance(data, list) else []
              except Exception:
                  return []

          for filename in FILES:
              best = []
              best_commit = None

              # 先看目前工作目錄
              if os.path.exists(filename):
                  try:
                      with open(filename, "r", encoding="utf-8-sig") as f:
                          current = json.load(f)

                      if isinstance(current, list):
                          best = current
                          best_commit = "CURRENT"
                  except Exception:
                      pass

              # 再翻 Git 歷史
              try:
                  commits = subprocess.check_output(
                      [
                          "git",
                          "log",
                          "--all",
                          "--format=%H",
                          "--",
                          filename,
                      ],
                      text=True,
                  ).splitlines()
              except Exception:
                  commits = []

              # 不需要無限翻
              # 取最近 100 個有修改過這個檔案的 commit
              for commit in commits[:100]:
                  try:
                      raw = subprocess.check_output(
                          ["git", "show", f"{commit}:{filename}"],
                          stderr=subprocess.DEVNULL,
                      )
                  except Exception:
                      continue

                  data = load_json_bytes(raw)

                  if len(data) > len(best):
                      best = data
                      best_commit = commit

              out = os.path.join(".safe-baseline", filename)

              with open(out, "w", encoding="utf-8") as f:
                  json.dump(
                      best,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )

              print(
                  f"{filename}: baseline={len(best)} "
                  f"source={best_commit}"
              )
          PY

      # ============================================================
      # 4. 建立／更新資料庫
      # ============================================================
      - name: Build and safely merge food databases
        shell: bash
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import re
          import zipfile
          from urllib.parse import urljoin

          import pandas as pd
          import requests
          from bs4 import BeautifulSoup


          # ========================================================
          # 基本設定
          # ========================================================

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                  "AppleWebKit/605.1.15 Version/18.0 "
                  "Mobile/15E148 Safari/604.1"
              ),
              "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.8",
          }

          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)


          def clean(value):
              if value is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(value),
              ).strip()


          # --------------------------------------------------------
          # 搜尋正規化
          #
          # 雞 / 鷄 / 鸡
          # 臺 / 台
          # 全形空白等
          # --------------------------------------------------------
          def normalize(value):
              s = clean(value).lower()

              replacements = {
                  "鷄": "雞",
                  "鸡": "雞",
                  "臺": "台",
                  "（": "(",
                  "）": ")",
                  "－": "-",
                  "　": " ",
              }

              for old, new in replacements.items():
                  s = s.replace(old, new)

              s = re.sub(r"\s+", "", s)

              return s


          def parse_num(value):
              if value is None:
                  return None

              text = (
                  str(value)
                  .replace(",", "")
                  .strip()
              )

              match = re.search(
                  r"-?\d+(?:\.\d+)?",
                  text,
              )

              if not match:
                  return None

              try:
                  return float(match.group())
              except Exception:
                  return None


          def safe_get(url, timeout=30):
              try:
                  r = SESSION.get(
                      url,
                      timeout=timeout,
                  )

                  r.raise_for_status()

                  return r

              except Exception as e:
                  print(
                      "GET FAILED:",
                      url,
                      e,
                  )

                  return None


          def load_json(path):
              if not os.path.exists(path):
                  return []

              try:
                  with open(
                      path,
                      "r",
                      encoding="utf-8-sig",
                  ) as f:
                      data = json.load(f)

                  if isinstance(data, list):
                      return data

              except Exception as e:
                  print(
                      "JSON load failed:",
                      path,
                      e,
                  )

              return []


          def save_json(path, data):
              with open(
                  path,
                  "w",
                  encoding="utf-8",
              ) as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )


          def unique_strings(values):
              result = []
              seen = set()

              for value in values:
                  value = clean(value)

                  if not value:
                      continue

                  key = normalize(value)

                  if key in seen:
                      continue

                  seen.add(key)
                  result.append(value)

              return result


          # ========================================================
          # 合併邏輯
          #
          # 核心原則：
          #
          # baseline 永遠保留
          # 新抓到的資料只負責補資料
          # 不可以因為爬蟲失敗把舊資料洗掉
          # ========================================================

          def item_key(item):
              brand = (
                  item.get("brand")
                  or item.get("store")
                  or ""
              )

              name = (
                  item.get("name")
                  or item.get("product")
                  or ""
              )

              return (
                  normalize(brand),
                  normalize(name),
              )


          def info_score(item):
              score = 0

              for key in [
                  "calories",
                  "protein",
                  "carbs",
                  "fat",
                  "serving",
              ]:
                  value = item.get(key)

                  if value not in [
                      None,
                      "",
                  ]:
                      score += 1

              if item.get("sourceUrl"):
                  score += 1

              return score


          def merge_item(old, new):
              """
              保留舊資料，
              但新資料有更完整欄位時補進去。
              """

              result = dict(old)

              for key, value in new.items():
                  if value in [
                      None,
                      "",
                      [],
                  ]:
                      continue

                  old_value = result.get(key)

                  if old_value in [
                      None,
                      "",
                      [],
                  ]:
                      result[key] = value


              # aliases 特別合併
              aliases = []

              if isinstance(
                  old.get("aliases"),
                  list,
              ):
                  aliases += old["aliases"]

              if isinstance(
                  new.get("aliases"),
                  list,
              ):
                  aliases += new["aliases"]

              result["aliases"] = unique_strings(
                  aliases
              )


              # 如果新資料明顯比較完整，
              # calories / macros 可以採新資料
              if info_score(new) > info_score(old):

                  for key in [
                      "calories",
                      "protein",
                      "carbs",
                      "fat",
                      "serving",
                      "source",
                      "sourceType",
                      "sourceUrl",
                  ]:

                      value = new.get(key)

                      if value not in [
                          None,
                          "",
                      ]:
                          result[key] = value

              return result


          def safe_merge(
              baseline,
              new_items,
          ):
              merged = {}

              # 先放 baseline
              for item in baseline:
                  if not isinstance(item, dict):
                      continue

                  key = item_key(item)

                  if not key[1]:
                      continue

                  merged[key] = item


              # 再把新資料加進去
              for item in new_items:
                  if not isinstance(item, dict):
                      continue

                  key = item_key(item)

                  if not key[1]:
                      continue

                  if key in merged:
                      merged[key] = merge_item(
                          merged[key],
                          item,
                      )
                  else:
                      merged[key] = item

              return list(
                  merged.values()
              )


          # ========================================================
          # 載入安全基底
          # ========================================================

          baseline = {}

          filenames = [
              "convenience-foods.json",
              "fastfood-foods.json",
              "drink-shop-foods.json",
              "taipei-foods.json",
              "tfda-foods.json",
              "official-chain-foods.json",
          ]

          for filename in filenames:

              path = os.path.join(
                  ".safe-baseline",
                  filename,
              )

              baseline[filename] = load_json(
                  path
              )

              print(
                  "SAFE BASELINE",
                  filename,
                  len(baseline[filename]),
              )


          # ========================================================
          # 5. TFDA
          # ========================================================

          print("\n=== TFDA ===")

          new_tfda = []

          tfda_url = (
              "https://data.fda.gov.tw/"
              "data/opendata/export/20/csv"
          )

          r = safe_get(
              tfda_url,
              timeout=60,
          )

          if r:

              try:
                  z = zipfile.ZipFile(
                      io.BytesIO(r.content)
                  )

                  csv_names = [
                      n
                      for n in z.namelist()
                      if n.lower().endswith(".csv")
                  ]

                  if not csv_names:
                      csv_names = z.namelist()

                  csv_name = csv_names[0]

                  raw = z.read(csv_name)

                  text = None

                  for encoding in [
                      "utf-8-sig",
                      "utf-8",
                      "cp950",
                      "big5",
                  ]:

                      try:
                          text = raw.decode(
                              encoding
                          )
                          break
                      except Exception:
                          pass

                  if text is None:
                      raise RuntimeError(
                          "TFDA decode failed"
                      )

                  df = pd.read_csv(
                      io.StringIO(text)
                  )


                  def find_col(*keywords):

                      for column in df.columns:

                          c = str(column)

                          if all(
                              keyword in c
                              for keyword in keywords
                          ):
                              return column

                      return None


                  food_col = (
                      find_col("樣品名稱")
                      or find_col("食品名稱")
                      or find_col("名稱")
                  )

                  alias_col = (
                      find_col("俗名")
                      or find_col("別名")
                  )

                  category_col = (
                      find_col("食品分類")
                      or find_col("分類")
                  )

                  nutrient_col = (
                      find_col("分析項")
                  )

                  per100_col = (
                      find_col("每100克")
                      or find_col("每100公克")
                      or find_col("每100")
                  )


                  temp = {}


                  if (
                      food_col
                      and nutrient_col
                      and per100_col
                  ):

                      for _, row in df.iterrows():

                          name = clean(
                              row.get(food_col)
                          )

                          if not name:
                              continue

                          key = normalize(name)

                          alias = (
                              clean(
                                  row.get(alias_col)
                              )
                              if alias_col
                              else ""
                          )

                          category = (
                              clean(
                                  row.get(category_col)
                              )
                              if category_col
                              else ""
                          )

                          if key not in temp:

                              temp[key] = {
                                  "name": name,
                                  "brand": "",
                                  "aliases": (
                                      [alias]
                                      if alias
                                      else []
                                  ),
                                  "category": category,
                                  "calories": None,
                                  "protein": None,
                                  "carbs": None,
                                  "fat": None,
                                  "per100g": True,
                                  "source": "TFDA",
                                  "sourceType": "official",
                              }

                          nutrient = clean(
                              row.get(
                                  nutrient_col
                              )
                          )

                          value = parse_num(
                              row.get(
                                  per100_col
                              )
                          )

                          if value is None:
                              continue

                          if "熱量" in nutrient:
                              temp[key]["calories"] = value

                          elif "蛋白質" in nutrient:
                              temp[key]["protein"] = value

                          elif (
                              "碳水化合物"
                              in nutrient
                          ):
                              temp[key]["carbs"] = value

                          elif "脂肪" in nutrient:
                              temp[key]["fat"] = value


                  new_tfda = [
                      item
                      for item in temp.values()
                      if item.get(
                          "calories"
                      ) is not None
                  ]

              except Exception as e:

                  print(
                      "TFDA PARSE FAILED:",
                      e,
                  )


          print(
              "New TFDA:",
              len(new_tfda),
          )


          # ========================================================
          # 6. 台北市 FoodTracer
          # ========================================================

          print(
              "\n=== Taipei FoodTracer ==="
          )

          new_taipei = []

          # 優先使用台北資料開放平台 CSV
          taipei_csv = (
              "https://data.taipei/api/frontstage/"
              "tpeod/dataset/resource.download?"
              "rid=29869b6f-1cd3-4ce8-8c78-eb85aeea8583"
          )

          r = safe_get(
              taipei_csv,
              timeout=90,
          )

          if r:

              try:

                  raw = r.content

                  text = None

                  for encoding in [
                      "utf-8-sig",
                      "utf-8",
                      "cp950",
                      "big5",
                  ]:

                      try:
                          text = raw.decode(
                              encoding
                          )
                          break
                      except Exception:
                          pass

                  if text is None:
                      raise RuntimeError(
                          "Taipei CSV decode failed"
                      )


                  df = pd.read_csv(
                      io.StringIO(text)
                  )

                  print(
                      "Taipei columns:",
                      list(df.columns),
                  )


                  def match_column(
                      columns,
                      keywords,
                  ):

                      for column in columns:

                          c = normalize(column)

                          for keyword in keywords:

                              if normalize(keyword) in c:
                                  return column

                      return None


                  cols = list(df.columns)

                  brand_col = match_column(
                      cols,
                      [
                          "品牌名稱",
                          "品牌",
                          "商號名稱",
                          "公司名稱",
                      ],
                  )

                  product_col = match_column(
                      cols,
                      [
                          "產品名稱",
                          "商品名稱",
                          "品名",
                          "餐點名稱",
                      ],
                  )

                  calorie_col = match_column(
                      cols,
                      [
                          "熱量",
                          "卡路里",
                      ],
                  )

                  serving_col = match_column(
                      cols,
                      [
                          "份量",
                          "每份",
                          "重量",
                          "容量",
                      ],
                  )

                  link_col = match_column(
                      cols,
                      [
                          "網址",
                          "連結",
                          "link",
                      ],
                  )


                  if product_col:

                      for _, row in df.iterrows():

                          name = clean(
                              row.get(
                                  product_col
                              )
                          )

                          if not name:
                              continue

                          brand = (
                              clean(
                                  row.get(
                                      brand_col
                                  )
                              )
                              if brand_col
                              else ""
                          )

                          calories = (
                              parse_num(
                                  row.get(
                                      calorie_col
                                  )
                              )
                              if calorie_col
                              else None
                          )

                          serving = (
                              clean(
                                  row.get(
                                      serving_col
                                  )
                              )
                              if serving_col
                              else ""
                          )

                          source_url = (
                              clean(
                                  row.get(
                                      link_col
                                  )
                              )
                              if link_col
                              else ""
                          )

                          new_taipei.append(
                              {
                                  "name": name,
                                  "brand": brand,
                                  "store": brand,
                                  "aliases": [],
                                  "calories": calories,
                                  "protein": None,
                                  "carbs": None,
                                  "fat": None,
                                  "serving": serving,
                                  "source": "臺北市食材登錄平台",
                                  "sourceType": "official-public",
                                  "sourceUrl": source_url,
                              }
                          )

              except Exception as e:

                  print(
                      "TAIPEI CSV FAILED:",
                      e,
                  )


          print(
              "New Taipei:",
              len(new_taipei),
          )


          # ========================================================
          # 7. 官方品牌
          # ========================================================

          print(
              "\n=== Official brands ==="
          )

          new_official = []


          def add_official(
              brand,
              name,
              url="",
              calories=None,
              protein=None,
              carbs=None,
              fat=None,
              serving="",
              aliases=None,
          ):

              name = clean(name)

              if not name:
                  return

              new_official.append(
                  {
                      "name": name,
                      "brand": brand,
                      "store": brand,
                      "aliases": unique_strings(
                          (aliases or [])
                          + [brand]
                      ),
                      "calories": calories,
                      "protein": protein,
                      "carbs": carbs,
                      "fat": fat,
                      "serving": serving,
                      "source": (
                          f"{brand} 官方"
                      ),
                      "sourceType": "official",
                      "sourceUrl": url,
                  }
              )


          # ========================================================
          # 麥當勞官方
          # ========================================================

          print("McDonald's")

          mcd_url = (
              "https://www.mcdonalds.com/"
              "tw/zh-tw/full-menu.html"
          )

          r = safe_get(mcd_url)

          if r:

              soup = BeautifulSoup(
                  r.text,
                  "lxml",
              )

              links = set()

              for a in soup.find_all(
                  "a",
                  href=True,
              ):

                  href = clean(
                      a.get("href")
                  )

                  if "/product/" in href:

                      links.add(
                          urljoin(
                              mcd_url,
                              href,
                          )
                      )


              print(
                  "McDonald's product pages:",
                  len(links),
              )


              for product_url in list(links)[:300]:

                  pr = safe_get(
                      product_url,
                      timeout=20,
                  )

                  if not pr:
                      continue

                  psoup = BeautifulSoup(
                      pr.text,
                      "lxml",
                  )

                  title = ""

                  for selector in [
                      "h1",
                      ".cmp-title__text",
                      ".product-name",
                      "title",
                  ]:

                      el = psoup.select_one(
                          selector
                      )

                      if el:

                          title = clean(
                              el.get_text(
                                  " ",
                                  strip=True,
                              )
                          )

                          if title:
                              break


                  title = re.sub(
                      r"\s*\|\s*McDonald.*$",
                      "",
                      title,
                      flags=re.I,
                  ).strip()


                  if not title:
                      continue


                  page_text = clean(
                      psoup.get_text(
                          " ",
                          strip=True,
                      )
                  )


                  def find_value(
                      patterns,
                  ):

                      for pattern in patterns:

                          match = re.search(
                              pattern,
                              page_text,
                              re.I,
                          )

                          if match:
                              return parse_num(
                                  match.group(1)
                              )

                      return None


                  calories = find_value(
                      [
                          r"熱量[^0-9]{0,25}(\d+(?:\.\d+)?)",
                          r"(\d+(?:\.\d+)?)\s*(?:大卡|kcal)",
                      ]
                  )

                  protein = find_value(
                      [
                          r"蛋白質[^0-9]{0,25}(\d+(?:\.\d+)?)",
                      ]
                  )

                  carbs = find_value(
                      [
                          r"碳水化合物[^0-9]{0,25}(\d+(?:\.\d+)?)",
                      ]
                  )

                  fat = find_value(
                      [
                          r"脂肪[^0-9]{0,25}(\d+(?:\.\d+)?)",
                      ]
                  )


                  add_official(
                      "麥當勞",
                      title,
                      product_url,
                      calories,
                      protein,
                      carbs,
                      fat,
                      aliases=[
                          "McDonald's",
                          "McDonalds",
                          "MCD",
                          "麥當",
                      ],
                  )


          # ========================================================
          # 麥脆雞搜尋保險
          #
          # 就算官方頁面當天結構改掉，
          # 至少名稱還能被搜尋到。
          # ========================================================

          mccrispy_backup = [
              "原味麥脆鷄腿",
              "辣味麥脆鷄腿",
              "原味麥脆鷄腿（大腿）",
              "原味麥脆鷄腿（棒腿）",
              "辣味麥脆鷄腿（大腿）",
              "辣味麥脆鷄腿（棒腿）",
              "麥脆鷄腿2塊",
              "麥脆鷄腿6塊分享盒",
          ]

          for name in mccrispy_backup:

              add_official(
                  "麥當勞",
                  name,
                  mcd_url,
                  aliases=[
                      "麥脆雞",
                      "麥脆鷄",
                      "McCrispy",
                      "麥當勞",
                  ],
              )


          # ========================================================
          # 把台北公開資料裡的連鎖品牌補入官方品牌資料庫
          # ========================================================

          BRAND_RULES = {
              "麥當勞": [
                  "麥當勞",
                  "mcdonald",
              ],
              "肯德基": [
                  "肯德基",
                  "kfc",
              ],
              "摩斯漢堡": [
                  "摩斯",
                  "mos",
              ],
              "漢堡王": [
                  "漢堡王",
                  "burgerking",
              ],
              "SUBWAY": [
                  "subway",
                  "賽百味",
              ],
              "必勝客": [
                  "必勝客",
                  "pizza hut",
              ],
              "達美樂": [
                  "達美樂",
                  "domino",
              ],
              "拿坡里": [
                  "拿坡里",
              ],
              "頂呱呱": [
                  "頂呱呱",
                  "tkk",
              ],
              "21風味館": [
                  "21風味館",
                  "21plus",
              ],
          }


          for item in new_taipei:

              haystack = normalize(
                  (
                      item.get(
                          "brand",
                          ""
                      )
                      + " "
                      + item.get(
                          "name",
                          ""
                      )
                  )
              )

              matched = None

              for brand, keywords in BRAND_RULES.items():

                  if any(
                      normalize(keyword)
                      in haystack
                      for keyword
                      in keywords
                  ):

                      matched = brand
                      break


              if matched:

                  copied = dict(item)

                  copied["brand"] = matched
                  copied["store"] = matched

                  copied["aliases"] = unique_strings(
                      copied.get(
                          "aliases",
                          []
                      )
                      + [matched]
                  )

                  new_official.append(
                      copied
                  )


          print(
              "New official:",
              len(new_official),
          )


          # ========================================================
          # 8. 從新資料建立速食／手搖補充資料
          # ========================================================

          FAST_KEYWORDS = [
              "麥當勞",
              "mcdonald",
              "肯德基",
              "kfc",
              "摩斯",
              "mos",
              "漢堡王",
              "burgerking",
              "subway",
              "賽百味",
              "必勝客",
              "pizzahut",
              "達美樂",
              "domino",
              "拿坡里",
              "頂呱呱",
              "21風味館",
              "21plus",
          ]


          DRINK_KEYWORDS = [
              "50嵐",
              "五十嵐",
              "coco",
              "清心",
              "麻古",
              "迷客夏",
              "可不可",
              "龜記",
              "珍煮丹",
              "茶湯會",
              "大苑子",
              "comebuy",
              "五桐號",
              "得正",
              "再睡5分鐘",
              "鶴茶樓",
              "萬波",
              "春水堂",
              "一沐日",
              "八曜和茶",
              "先喝道",
          ]


          new_fastfood = []
          new_drinks = []


          for item in (
              new_taipei
              + new_official
          ):

              text = normalize(
                  (
                      item.get(
                          "brand",
                          ""
                      )
                      + " "
                      + item.get(
                          "store",
                          ""
                      )
                      + " "
                      + item.get(
                          "name",
                          ""
                      )
                  )
              )


              if any(
                  normalize(keyword)
                  in text
                  for keyword
                  in FAST_KEYWORDS
              ):

                  new_fastfood.append(
                      item
                  )


              if any(
                  normalize(keyword)
                  in text
                  for keyword
                  in DRINK_KEYWORDS
              ):

                  new_drinks.append(
                      item
                  )


          # ========================================================
          # 9. SAFE MERGE
          # ========================================================

          final_tfda = safe_merge(
              baseline[
                  "tfda-foods.json"
              ],
              new_tfda,
          )

          final_taipei = safe_merge(
              baseline[
                  "taipei-foods.json"
              ],
              new_taipei,
          )

          final_official = safe_merge(
              baseline[
                  "official-chain-foods.json"
              ],
              new_official,
          )

          final_fastfood = safe_merge(
              baseline[
                  "fastfood-foods.json"
              ],
              new_fastfood,
          )

          final_drinks = safe_merge(
              baseline[
                  "drink-shop-foods.json"
              ],
              new_drinks,
          )


          # 超商 v7 暫時不重抓
          # 完整保留歷史最大版本
          final_convenience = baseline[
              "convenience-foods.json"
          ]


          # ========================================================
          # 10. 最後安全檢查
          #
          # 任何 final 比 baseline 少
          # → 直接報錯
          # → 不准 commit
          # ========================================================

          finals = {
              "convenience-foods.json":
                  final_convenience,

              "fastfood-foods.json":
                  final_fastfood,

              "drink-shop-foods.json":
                  final_drinks,

              "taipei-foods.json":
                  final_taipei,

              "tfda-foods.json":
                  final_tfda,

              "official-chain-foods.json":
                  final_official,
          }


          print(
              "\n=== SAFETY CHECK ==="
          )


          for filename, data in finals.items():

              old_count = len(
                  baseline[filename]
              )

              new_count = len(data)

              print(
                  f"{filename}: "
                  f"{old_count} -> {new_count}"
              )

              if new_count < old_count:

                  raise RuntimeError(
                      f"SAFETY STOP: "
                      f"{filename} shrank "
                      f"from {old_count} "
                      f"to {new_count}"
                  )


          # ========================================================
          # 11. 寫入
          # ========================================================

          for filename, data in finals.items():

              save_json(
                  filename,
                  data,
              )


          print(
              "\n=== FINAL COUNTS ==="
          )

          for filename, data in finals.items():

              print(
                  f"{filename}: "
                  f"{len(data)}"
              )

          print(
              "\nSAFE MERGE COMPLETE"
          )

          PY

