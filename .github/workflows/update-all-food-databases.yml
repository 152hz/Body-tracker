      # ============================================================
      # 6. 暫存產出的安全資料
      # ============================================================
      - name: Save generated databases
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fooddb"

          cp convenience-foods.json "$RUNNER_TEMP/fooddb/"
          cp fastfood-foods.json "$RUNNER_TEMP/fooddb/"
          cp drink-shop-foods.json "$RUNNER_TEMP/fooddb/"
          cp taipei-foods.json "$RUNNER_TEMP/fooddb/"
          cp tfda-foods.json "$RUNNER_TEMP/fooddb/"
          cp official-chain-foods.json "$RUNNER_TEMP/fooddb/"

      # ============================================================
      # 7. Retry-safe commit
      #
      # 如果你剛好同時在 GitHub 改 index.html，
      # Action push 發生衝突，
      # 它會重新抓 main 再重試。
      # ============================================================
      - name: Commit updated databases retry safe
        shell: bash
        run: |
          set -e

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5
          do

            echo ""
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            cp \
              "$RUNNER_TEMP/fooddb/convenience-foods.json" \
              .

            cp \
              "$RUNNER_TEMP/fooddb/fastfood-foods.json" \
              .

            cp \
              "$RUNNER_TEMP/fooddb/drink-shop-foods.json" \
              .

            cp \
              "$RUNNER_TEMP/fooddb/taipei-foods.json" \
              .

            cp \
              "$RUNNER_TEMP/fooddb/tfda-foods.json" \
              .

            cp \
              "$RUNNER_TEMP/fooddb/official-chain-foods.json" \
              .


            git add \
              convenience-foods.json \
              fastfood-foods.json \
              drink-shop-foods.json \
              taipei-foods.json \
              tfda-foods.json \
              official-chain-foods.json


            if git diff --cached --quiet
            then

              echo "No database changes."
              exit 0

            fi


            git commit \
              -m "Update food databases v7 safe merge"


            if git push origin HEAD:main
            then

              echo ""
              echo "Push succeeded."
              exit 0

            fi


            echo ""
            echo "Push conflict."
            echo "Retrying in 5 seconds..."

            sleep 5

          done


          echo ""
          echo "Push failed after 5 retries."

          exit 1
