name: Update all food databases v8 expanded safe merge

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 0"

permissions:
  contents: write

concurrency:
  group: update-all-food-databases
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests pandas

      - name: Build expanded databases safely
        shell: bash
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import re
          import subprocess
          import zipfile
          import pandas as pd
          import requests

          FILES = [
              "convenience-foods.json",
              "fastfood-foods.json",
              "drink-shop-foods.json",
              "taipei-foods.json",
              "tfda-foods.json",
              "official-chain-foods.json",
              "school-foods.json"
          ]

          S = requests.Session()
          S.headers.update({
              "User-Agent":
                  "Mozilla/5.0 AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language":
                  "zh-TW,zh;q=0.9,en;q=0.7"
          })

          def clean(v):
              if v is None:
                  return ""

              if isinstance(v, float) and pd.isna(v):
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(v)
              ).strip()

          def norm(v):
              s = clean(v).lower()

              replacements = {
                  "鷄": "雞",
                  "鸡": "雞",
                  "臺": "台",
                  "　": " ",
                  "（": "(",
                  "）": ")"
              }

              for a, b in replacements.items():
                  s = s.replace(a, b)

              return re.sub(
                  r"[\s\-_]+",
                  "",
                  s
              )

          def num(v):
              if v is None:
                  return None

              m = re.search(
                  r"-?\d+(?:\.\d+)?",
                  str(v).replace(",", "")
              )

              return (
                  float(m.group())
                  if m
                  else None
              )

          def load_bytes(raw):
              try:
                  x = json.loads(
                      raw.decode("utf-8-sig")
                  )

                  return (
                      x
                      if isinstance(x, list)
                      else x.get("items", [])
                  )

              except Exception:
                  return []

          def load(path):
              try:
                  with open(
                      path,
                      encoding="utf-8-sig"
                  ) as f:

                      x = json.load(f)

                      return (
                          x
                          if isinstance(x, list)
                          else x.get("items", [])
                      )

              except Exception:
                  return []

          def save(path, x):
              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      x,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

          def safe_get(
              url,
              timeout=90,
              **kw
          ):
              try:
                  r = S.get(
                      url,
                      timeout=timeout,
                      **kw
                  )

                  r.raise_for_status()

                  return r

              except Exception as e:
                  print(
                      "GET FAILED",
                      url,
                      e
                  )

                  return None

          # ==================================================
          # 找出 Git 歷史中每個資料庫筆數最多的版本
          # ==================================================

          baseline = {}

          for fn in FILES:
              best = load(fn)
              source = "current"

              try:
                  commits = subprocess.check_output(
                      [
                          "git",
                          "log",
                          "--all",
                          "--format=%H",
                          "--",
                          fn
                      ],
                      text=True
                  ).splitlines()

              except Exception:
                  commits = []

              for c in commits[:120]:

                  try:
                      raw = subprocess.check_output(
                          [
                              "git",
                              "show",
                              f"{c}:{fn}"
                          ],
                          stderr=subprocess.DEVNULL
                      )

                      arr = load_bytes(raw)

                  except Exception:
                      continue

                  if len(arr) > len(best):
                      best = arr
                      source = c[:8]

              baseline[fn] = best

              print(
                  f"BASELINE {fn}: "
                  f"{len(best)} ({source})"
              )

          # ==================================================
          # 安全合併
          # ==================================================

          def key(x):
              return (
                  norm(
                      x.get("brand")
                      or x.get("store")
                      or ""
                  ),
                  norm(
                      x.get("name")
                      or x.get("product")
                      or ""
                  )
              )

          def present(v):
              return (
                  v is not None
                  and v != ""
                  and not (
                      isinstance(v, float)
                      and pd.isna(v)
                  )
              )

          def merge_item(old, new):
              out = dict(old)

              for k, v in new.items():

                  # 沒有資料就不要寫入
                  # 特別避免 null 被當成 0
                  if not present(v):
                      continue

                  if k == "aliases":
                      vals = []

                      for z in (
                          old.get("aliases", []),
                          new.get("aliases", [])
                      ):
                          vals += (
                              z
                              if isinstance(z, list)
                              else ([z] if z else [])
                          )

                      seen = set()
                      out[k] = []

                      for a in vals:
                          n = norm(a)

                          if (
                              n
                              and n not in seen
                          ):
                              seen.add(n)
                              out[k].append(
                                  clean(a)
                              )

                  elif (
                      not present(out.get(k))
                      or k in (
                          "calories",
                          "protein",
                          "carbs",
                          "fat",
                          "serving"
                      )
                  ):
                      out[k] = v

              return out

          def merge(base, new):
              d = {}

              for x in base:
                  if (
                      isinstance(x, dict)
                      and key(x)[1]
                  ):
                      d[key(x)] = x

              for x in new:
                  if (
                      not isinstance(x, dict)
                      or not key(x)[1]
                  ):
                      continue

                  k = key(x)

                  if k in d:
                      d[k] = merge_item(
                          d[k],
                          x
                      )

                  else:
                      d[k] = x

              return list(
                  d.values()
              )

          # ==================================================
          # 臺北市食材登錄
          # 使用官方完整 CSV
          # ==================================================

          new_taipei = []

          TAIPEI = (
              "https://data.taipei/"
              "api/frontstage/tpeod/"
              "dataset/resource.download?"
              "rid=29869b6f-1cd3-4ce8-8c78-eb85aeea8583"
          )

          r = safe_get(TAIPEI)

          if r:

              text = None

              for enc in (
                  "utf-8-sig",
                  "utf-8",
                  "cp950",
                  "big5"
              ):

                  try:
                      text = r.content.decode(enc)
                      break

                  except Exception:
                      pass

              if text:

                  try:
                      df = pd.read_csv(
                          io.StringIO(text),
                          dtype=str,
                          keep_default_na=False
                      )

                      print(
                          "TAIPEI COLUMNS:",
                          list(df.columns)
                      )

                      def col(name):
                          for c in df.columns:

                              if (
                                  norm(c)
                                  == norm(name)
                              ):
                                  return c

                          return None

                      c_company = col(
                          "公司名稱"
                      )

                      c_brand = col(
                          "品牌名稱"
                      )

                      c_product = col(
                          "產品名稱"
                      )

                      c_serv = col(
                          "每一份量"
                      )

                      c_cal = col(
                          "熱量大卡"
                      )

                      c_url = col(
                          "相關資訊連結"
                      )

                      if not c_product:
                          raise RuntimeError(
                              "找不到官方欄位：產品名稱"
                          )

                      for _, row in df.iterrows():

                          name = clean(
                              row.get(c_product)
                          )

                          if not name:
                              continue

                          brand = (
                              clean(
                                  row.get(c_brand)
                              )
                              if c_brand
                              else ""
                          )

                          company = (
                              clean(
                                  row.get(c_company)
                              )
                              if c_company
                              else ""
                          )

                          cal = (
                              num(
                                  row.get(c_cal)
                              )
                              if c_cal
                              else None
                          )

                          new_taipei.append({
                              "name": name,

                              "brand":
                                  brand or company,

                              "store":
                                  brand or company,

                              "aliases": [
                                  x
                                  for x in [
                                      company,
                                      brand
                                  ]
                                  if x
                              ],

                              "calories": cal,

                              # 沒有資料就是 None
                              # 絕對不填 0
                              "protein": None,
                              "carbs": None,
                              "fat": None,

                              "serving":
                                  clean(
                                      row.get(c_serv)
                                  )
                                  if c_serv
                                  else "",

                              "quality":
                                  "official-public",

                              "source":
                                  "臺北市食材登錄平台",

                              "sourceType":
                                  "official-public",

                              "sourceUrl":
                                  clean(
                                      row.get(c_url)
                                  )
                                  if c_url
                                  else TAIPEI
                          })

                  except Exception as e:
                      print(
                          "TAIPEI PARSE FAILED",
                          e
                      )

          print(
              "NEW TAIPEI",
              len(new_taipei)
          )

          # ==================================================
          # TFDA 食品營養成分
          # ==================================================

          new_tfda = []

          r = safe_get(
              "https://data.fda.gov.tw/"
              "data/opendata/export/20/csv"
          )

          if r:

              try:
                  z = zipfile.ZipFile(
                      io.BytesIO(r.content)
                  )

                  names = [
                      n
                      for n in z.namelist()
                      if n.lower().endswith(
                          ".csv"
                      )
                  ] or z.namelist()

                  raw = z.read(
                      names[0]
                  )

                  text = None

                  for enc in (
                      "utf-8-sig",
                      "utf-8",
                      "cp950",
                      "big5"
                  ):

                      try:
                          text = raw.decode(enc)
                          break

                      except Exception:
                          pass

                  df = pd.read_csv(
                      io.StringIO(text),
                      dtype=str,
                      keep_default_na=False
                  )

                  def find(*words):
                      for c in df.columns:

                          if all(
                              w in str(c)
                              for w in words
                          ):
                              return c

                  food = (
                      find("樣品名稱")
                      or find("食品名稱")
                      or find("名稱")
                  )

                  alias = (
                      find("俗名")
                      or find("別名")
                  )

                  cat = (
                      find("食品分類")
                      or find("分類")
                  )

                  nutrient = find(
                      "分析項"
                  )

                  per100 = (
                      find("每100克")
                      or find("每100公克")
                      or find("每100")
                  )

                  tmp = {}

                  if (
                      food
                      and nutrient
                      and per100
                  ):

                      for _, row in df.iterrows():

                          name = clean(
                              row.get(food)
                          )

                          if not name:
                              continue

                          k = norm(name)

                          item = tmp.setdefault(
                              k,
                              {
                                  "name": name,
                                  "brand": "",
                                  "store":
                                      "食藥署資料庫",
                                  "aliases": [],
                                  "category":
                                      clean(
                                          row.get(cat)
                                      )
                                      if cat
                                      else "",
                                  "calories": None,
                                  "protein": None,
                                  "carbs": None,
                                  "fat": None,
                                  "serving":
                                      "每100g",
                                  "quality":
                                      "official",
                                  "source":
                                      "TFDA",
                                  "sourceType":
                                      "official"
                              }
                          )

                          if alias:

                              alias_value = clean(
                                  row.get(alias)
                              )

                              if (
                                  alias_value
                                  and alias_value
                                  not in item[
                                      "aliases"
                                  ]
                              ):
                                  item[
                                      "aliases"
                                  ].append(
                                      alias_value
                                  )

                          n = clean(
                              row.get(nutrient)
                          )

                          v = num(
                              row.get(per100)
                          )

                          if v is None:
                              continue

                          if "熱量" in n:
                              item[
                                  "calories"
                              ] = v

                          elif "蛋白質" in n:
                              item[
                                  "protein"
                              ] = v

                          elif (
                              "碳水化合物"
                              in n
                          ):
                              item[
                                  "carbs"
                              ] = v

                          elif "脂肪" in n:
                              item[
                                  "fat"
                              ] = v

                  new_tfda = [
                      x
                      for x in tmp.values()

                      if (
                          x["calories"]
                          is not None

                          or any(
                              x[k]
                              is not None

                              for k in (
                                  "protein",
                                  "carbs",
                                  "fat"
                              )
                          )
                      )
                  ]

              except Exception as e:
                  print(
                      "TFDA FAILED",
                      e
                  )

          print(
              "NEW TFDA",
              len(new_tfda)
          )

          # ==================================================
          # 教育部校園食材登錄
          #
          # 這裡只補「品項名稱」
          # 沒有可靠營養資料就維持 None
          # ==================================================

          new_school = []

          OPENAPI = (
              "https://fatraceschool.k12ea.gov.tw/"
              "cateringservice/web/openapi_doc/"
              "v1/openapi.json"
          )

          rr = safe_get(
              OPENAPI,
              timeout=30,
              headers={
                  "Referer":
                      "https://fatraceschool.k12ea.gov.tw/"
                      "cateringservice/web/"
                      "openapi_doc/v1/index.html"
              }
          )

          if rr:

              try:
                  spec = rr.json()

                  print(
                      "MOE OPENAPI paths",
                      len(
                          spec.get(
                              "paths",
                              {}
                          )
                      )
                  )

                  blob = json.dumps(
                      spec,
                      ensure_ascii=False
                  )

                  vals = re.findall(
                      r'"([^"\\]{2,30})"',
                      blob
                  )

                  bad = (
                      "學校",
                      "縣市",
                      "日期",
                      "供應商",
                      "食材",
                      "欄位",
                      "參數",
                      "說明",
                      "錯誤",
                      "成功",
                      "午餐",
                      "資料"
                  )

                  for v in vals:

                      v = clean(v)

                      if not re.search(
                          r"[\u4e00-\u9fff]",
                          v
                      ):
                          continue

                      if any(
                          b in v
                          for b in bad
                      ):
                          continue

                      if not any(
                          k in v
                          for k in (
                              "飯",
                              "麵",
                              "雞",
                              "豬",
                              "牛",
                              "魚",
                              "蛋",
                              "菜",
                              "湯",
                              "豆腐",
                              "排",
                              "粥",
                              "瓜",
                              "肉"
                          )
                      ):
                          continue

                      new_school.append({
                          "name": v,
                          "brand": "",
                          "store":
                              "教育部校園菜色",
                          "aliases": [],

                          # 不知道就是 None
                          "calories": None,
                          "protein": None,
                          "carbs": None,
                          "fat": None,

                          "serving": "",
                          "quality": "index",
                          "source":
                              "教育部校園食材登錄平台2.0",
                          "sourceType":
                              "official-index",
                          "sourceUrl":
                              "https://fatraceschool.k12ea.gov.tw/"
                      })

              except Exception as e:
                  print(
                      "MOE OPENAPI PARSE FAILED",
                      e
                  )

          print(
              "NEW SCHOOL",
              len(new_school)
          )

          # ==================================================
          # 從臺北大型資料庫建立速食分類
          # ==================================================

          fast_kw = [
              "麥當勞",
              "mcdonald",
              "肯德基",
              "kfc",
              "摩斯",
              "mos",
              "漢堡王",
              "burgerking",
              "subway",
              "賽百味",
              "必勝客",
              "pizzahut",
              "達美樂",
              "domino",
              "拿坡里",
              "頂呱呱",
              "21風味館",
              "21plus"
          ]

          # ==================================================
          # 手搖飲品牌
          # ==================================================

          drink_kw = [
              "50嵐",
              "五十嵐",
              "coco",
              "清心",
              "麻古",
              "迷客夏",
              "可不可",
              "龜記",
              "珍煮丹",
              "茶湯會",
              "大苑子",
              "comebuy",
              "五桐號",
              "得正",
              "再睡5分鐘",
              "鶴茶樓",
              "萬波",
              "春水堂",
              "一沐日",
              "八曜和茶",
              "先喝道"
          ]

          def hit(x, kws):

              t = norm(
                  (
                      x.get("brand")
                      or ""
                  )
                  + " "
                  + (
                      x.get("store")
                      or ""
                  )
                  + " "
                  + (
                      x.get("name")
                      or ""
                  )
              )

              return any(
                  norm(k) in t
                  for k in kws
              )

          new_fast = [
              x
              for x in new_taipei
              if hit(
                  x,
                  fast_kw
              )
          ]

          new_drink = [
              x
              for x in new_taipei
              if hit(
                  x,
                  drink_kw
              )
          ]

          # 臺北公開資料中的速食品牌
          # 同時補進官方品牌索引
          new_official = new_fast[:]

          # ==================================================
          # 最終 SAFE MERGE
          # ==================================================

          finals = {
              "convenience-foods.json":
                  baseline[
                      "convenience-foods.json"
                  ],

              "fastfood-foods.json":
                  merge(
                      baseline[
                          "fastfood-foods.json"
                      ],
                      new_fast
                  ),

              "drink-shop-foods.json":
                  merge(
                      baseline[
                          "drink-shop-foods.json"
                      ],
                      new_drink
                  ),

              "taipei-foods.json":
                  merge(
                      baseline[
                          "taipei-foods.json"
                      ],
                      new_taipei
                  ),

              "tfda-foods.json":
                  merge(
                      baseline[
                          "tfda-foods.json"
                      ],
                      new_tfda
                  ),

              "official-chain-foods.json":
                  merge(
                      baseline[
                          "official-chain-foods.json"
                      ],
                      new_official
                  ),

              "school-foods.json":
                  merge(
                      baseline[
                          "school-foods.json"
                      ],
                      new_school
                  )
          }

          # ==================================================
          # 防縮水
          # ==================================================

          print(
              "\n=== SAFETY CHECK ==="
          )

          for fn, data in finals.items():

              old = len(
                  baseline[fn]
              )

              new = len(data)

              print(
                  f"{fn}: "
                  f"{old} -> {new}"
              )

              if new < old:
                  raise RuntimeError(
                      f"SAFETY STOP: "
                      f"{fn} shrank"
                  )

              save(
                  fn,
                  data
              )

          print(
              "\nV8 SAFE MERGE COMPLETE"
          )

          PY

      # ======================================================
      # 顯示各資料庫筆數
      # ======================================================

      - name: Show database counts
        run: |
          python - <<'PY'
          import json

          files = [
              "convenience-foods.json",
              "fastfood-foods.json",
              "drink-shop-foods.json",
              "taipei-foods.json",
              "tfda-foods.json",
              "official-chain-foods.json",
              "school-foods.json"
          ]

          print("")
          print("============================")
          print(" FOOD DATABASE COUNTS")
          print("============================")

          for f in files:

              try:
                  with open(
                      f,
                      encoding="utf-8-sig"
                  ) as h:

                      x = json.load(h)

                  data = (
                      x
                      if isinstance(x, list)
                      else x.get(
                          "items",
                          []
                      )
                  )

                  print(
                      f"{f}: "
                      f"{len(data)}"
                  )

              except Exception as e:

                  print(
                      f"{f}: ERROR {e}"
                  )

          print("============================")
          PY

      # ======================================================
      # 暫存結果
      # ======================================================

      - name: Save generated databases
        run: |
          mkdir -p "$RUNNER_TEMP/fooddb"

          cp *-foods.json \
            "$RUNNER_TEMP/fooddb/" \
            2>/dev/null || true

      # ======================================================
      # Retry-safe push
      # ======================================================

      - name: Commit updated databases retry safe
        shell: bash
        run: |
          set -e

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5
          do

            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            cp \
              "$RUNNER_TEMP/fooddb/"*-foods.json \
              .

            git add \
              convenience-foods.json \
              fastfood-foods.json \
              drink-shop-foods.json \
              taipei-foods.json \
              tfda-foods.json \
              official-chain-foods.json \
              school-foods.json

            if git diff --cached --quiet
            then
              echo "No changes"
              exit 0
            fi

            git commit \
              -m "Update food databases v8 expanded safe merge"

            if git push origin HEAD:main
            then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push conflict, retrying..."
            sleep 5

          done

          echo "Push failed after retries"
          exit 1
