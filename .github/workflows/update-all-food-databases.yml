          for f in files:

              with open(
                  f,
                  encoding="utf-8-sig"
              ) as h:
                  x=json.load(h)

              data=(
                  x
                  if isinstance(x,list)
                  else x.get(
                      "items",
                      []
                  )
              )

              mb=(
                  os.path.getsize(f)
                  /1024
                  /1024
              )

              print(
                  f"{f}: "
                  f"{len(data):,} rows / "
                  f"{mb:.2f} MB"
              )

          print(
              "==============================="
          )

          PY

      - name: Save generated databases
        run: |
          mkdir -p "$RUNNER_TEMP/fooddb"

          cp *-foods.json \
            "$RUNNER_TEMP/fooddb/" \
            2>/dev/null || true

      - name: Commit updated databases retry safe
        shell: bash
        run: |
          set -e

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5
          do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            cp \
              "$RUNNER_TEMP/fooddb/"*-foods.json \
              .

            git add \
              convenience-foods.json \
              fastfood-foods.json \
              drink-shop-foods.json \
              processed-foods.json \
              taipei-foods.json \
              tfda-foods.json \
              official-chain-foods.json \
              school-foods.json

            if git diff --cached --quiet
            then
              echo "No changes"
              exit 0
            fi

            git commit \
              -m "Update food databases v9 processed foods and school dishes"

            if git push origin HEAD:main
            then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push conflict, retrying..."
            sleep 5
          done

          echo "Push failed after retries"
          exit 1
