name: Update food databases

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * 0'
  push:
    paths:
      - '.github/workflows/update-food-databases.yml'

permissions:
  contents: write

jobs:
  update-food-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4

      - name: Update TFDA database
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import re
          import urllib.request
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          URL = "https://data.fda.gov.tw/data/opendata/export/20/csv"

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0 BodyTrackerFoodDB/1.0",
                  "Accept": "*/*",
              },
          )
          with urllib.request.urlopen(req, timeout=120) as resp:
              blob = resp.read()

          if not zipfile.is_zipfile(io.BytesIO(blob)):
              raise RuntimeError("TFDA response is not a ZIP file")

          def decode_bytes(b):
              for enc in ("utf-8-sig", "utf-8", "cp950", "big5"):
                  try:
                      return b.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return b.decode("utf-8", errors="replace")

          def norm(s):
              return re.sub(r"[\s\u3000]+", "", str(s or "")).lower()

          def num(v):
              m = re.search(r"-?\d+(?:\.\d+)?", str(v or "").replace(",", ""))
              return float(m.group()) if m else None

          foods = {}
          with zipfile.ZipFile(io.BytesIO(blob)) as zf:
              csv_names = [n for n in zf.namelist() if n.lower().endswith(".csv") and not n.endswith("/")]
              if not csv_names:
                  raise RuntimeError("No CSV found inside TFDA ZIP")

              for name in csv_names:
                  text = decode_bytes(zf.read(name))
                  rows = csv.reader(io.StringIO(text))
                  try:
                      headers = next(rows)
                  except StopIteration:
                      continue

                  headers = [str(h).strip().lstrip("\ufeff") for h in headers]
                  lookup = {norm(h): i for i, h in enumerate(headers)}

                  def idx(*names):
                      for n in names:
                          if norm(n) in lookup:
                              return lookup[norm(n)]
                      return -1

                  i_cat = idx("食品分類")
                  i_id = idx("整合編號")
                  i_name = idx("樣品名稱")
                  i_alias = idx("俗名")
                  i_item = idx("分析項")
                  i_per100 = idx("每100克含量")
                  i_perunit = idx("每單位含量")
                  i_unitweight = idx("每單位重")

                  if min(i_name, i_item, i_per100) < 0:
                      continue

                  for row in rows:
                      def get(i):
                          return row[i].strip() if i >= 0 and i < len(row) else ""

                      analysis_item = get(i_item)
                      if "熱量" not in analysis_item and "energy" not in analysis_item.lower():
                          continue

                      food_name = get(i_name)
                      if not food_name:
                          continue

                      alias = get(i_alias)
                      per100 = num(get(i_per100))
                      perunit = num(get(i_perunit))
                      unitweight = num(get(i_unitweight))

                      if perunit is not None and perunit > 0:
                          cal = perunit
                          unit = "每單位"
                      else:
                          cal = per100
                          unit = "每100g"

                      if cal is None or cal <= 0:
                          continue

                      integrate_id = get(i_id) or food_name
                      key = integrate_id + "|" + food_name
                      foods[key] = {
                          "id": "tfda:" + integrate_id,
                          "name": food_name,
                          "alias": alias,
                          "cal": round(cal, 1),
                          "cal100": round(per100, 1) if per100 is not None else None,
                          "unitWeight": unitweight,
                          "unit": unit,
                          "category": get(i_cat),
                          "quality": "official",
                          "source": "TFDA"
                      }

          items = list(foods.values())
          items.sort(key=lambda x: (x.get("category") or "", x.get("name") or ""))

          out = {
              "meta": {
                  "name": "衛生福利部食品藥物管理署－食品營養成分資料集（本地快取）",
                  "status": "ok",
                  "generatedAt": datetime.now(timezone.utc).isoformat(),
                  "source": URL,
                  "count": len(items)
              },
              "items": items
          }

          Path("tfda-foods.json").write_text(
              json.dumps(out, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8"
          )
          print(f"Generated {len(items)} TFDA foods")
          PY

      - name: Update fast-food and drink-shop public calorie databases
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, parse_qs

          import requests
          from bs4 import BeautifulSoup

          FASTFOOD_LIST = "https://foodtracer.health.gov.taipei/UniPages/CustPageView?fid=cf6c72c0-d165-456c-9721-56579014ad93&mid=b9f0aa7c-8b7e-4eb0-8017-f3c0a2e93a39"
          DRINK_LIST = "https://foodtracer.health.gov.taipei/UniPages/CustPageView?fid=e4be779e-3d89-46c4-ae3f-082701ee32cd&mid=e85a79c7-cd54-4aa5-9719-c8a9d0e575ce"

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36 BodyTrackerFoodDB/1.1",
              "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.6",
          }

          def get(url):
              r = requests.get(url, headers=HEADERS, timeout=(5, 12))
              r.raise_for_status()
              r.encoding = r.apparent_encoding or "utf-8"
              return r.text

          def clean(s):
              return re.sub(r"\s+", " ", str(s or "")).strip()

          def num(s):
              m = re.search(r"\d+(?:\.\d+)?", str(s or "").replace(",", ""))
              return float(m.group()) if m else None

          def link_kind(href):
              try:
                  q = parse_qs(urlparse(href).query)
                  if "company_id" in q and "itemno" in q:
                      return "product"
                  if "company_id" in q:
                      return "brand"
              except Exception:
                  pass
              return None

          def collect_links(html, base, kind):
              soup = BeautifulSoup(html, "html.parser")
              out = []
              seen = set()
              for a in soup.find_all("a", href=True):
                  href = urljoin(base, a["href"]).split("#")[0]
                  if link_kind(href) != kind or href in seen:
                      continue
                  label = clean(a.get_text(" ", strip=True))
                  if not label:
                      continue
                  seen.add(href)
                  out.append((label, href))
              return out

          def discover_brand_links(list_url):
              # 穩定版：只抓官方頁面實際回傳的業者連結，不再猜 50+ 種分頁網址。
              return collect_links(get(list_url), list_url, "brand")

          def discover_product_links(brand_url):
              # 穩定版：只抓業者頁實際回傳的產品連結，避免每品牌暴力嘗試 40+ 個網址。
              return collect_links(get(brand_url), brand_url, "product")

          def extract_table_variants(soup):
              variants = []
              for table in soup.find_all("table"):
                  rows = []
                  for tr in table.find_all("tr"):
                      cells = [clean(x.get_text(" ", strip=True)) for x in tr.find_all(["th", "td"])]
                      if cells:
                          rows.append(cells)
                  if not rows:
                      continue

                  header_i = None
                  cal_i = None
                  for ri, cells in enumerate(rows[:5]):
                      for ci, cell in enumerate(cells):
                          if "熱量" in cell:
                              header_i = ri
                              cal_i = ci
                              break
                      if cal_i is not None:
                          break
                  if cal_i is None:
                      continue

                  for cells in rows[(header_i or 0) + 1:]:
                      if cal_i >= len(cells):
                          continue
                      cal = num(cells[cal_i])
                      if cal is None or cal < 0 or cal > 5000:
                          continue
                      size = ""
                      for ci, cell in enumerate(cells):
                          if ci != cal_i and cell and "熱量" not in cell:
                              size = cell
                              break
                      variants.append((size, cal))
              return variants

          def extract_text_variants(soup):
              text = soup.get_text(" ", strip=True)
              variants = []

              pat = re.compile(
                  r"容量\s*[:：]\s*(.{1,45}?)\s*熱量\s*[（(]?\s*大卡\s*[）)]?\s*[:：]\s*(\d+(?:\.\d+)?)",
                  re.I,
              )
              for m in pat.finditer(text):
                  variants.append((clean(m.group(1)), float(m.group(2))))

              # 兼容「約102克 約260大卡」「熱量 260 kcal」等格式。
              if not variants and ("熱量" in text or "kcal" in text.lower() or "大卡" in text):
                  patterns = [
                      r"(?:每一份量.{0,120}?)?(約?\s*\d+(?:\.\d+)?\s*(?:克|g|ml|毫升|份|個|塊|杯))?.{0,80}?約?\s*(\d+(?:\.\d+)?)\s*(?:大卡|kcal)",
                      r"熱量\s*[:：]?\s*(\d+(?:\.\d+)?)\s*(?:大卡|kcal)?",
                  ]
                  for pattern in patterns:
                      m = re.search(pattern, text, re.I)
                      if not m:
                          continue
                      if len(m.groups()) >= 2:
                          variants.append((clean(m.group(1) or "每份"), float(m.group(2))))
                      else:
                          variants.append(("每份", float(m.group(1))))
                      break
              return variants

          def extract_variants(html):
              soup = BeautifulSoup(html, "html.parser")
              variants = extract_table_variants(soup) + extract_text_variants(soup)
              out = []
              seen = set()
              for size, cal in variants:
                  key = (clean(size), round(float(cal), 2))
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append(key)
              return out

          def load_existing(path):
              p = Path(path)
              if not p.exists():
                  return []
              try:
                  raw = json.loads(p.read_text(encoding="utf-8"))
                  return raw if isinstance(raw, list) else raw.get("items", [])
              except Exception:
                  return []

          def fetch_products_for_brand(brand, brand_url):
              try:
                  return brand, discover_product_links(brand_url), None
              except Exception as e:
                  return brand, [], repr(e)

          def fetch_product(product):
              brand, product_name, product_url, kind = product
              try:
                  html = get(product_url)
                  return product, extract_variants(html), None
              except Exception as e:
                  return product, [], repr(e)

          def crawl(list_url, kind, out_path, label):
              existing = load_existing(out_path)
              by_key = {}
              for x in existing:
                  brand = clean(x.get("brand") or x.get("store"))
                  name = clean(x.get("name"))
                  size = clean(x.get("size"))
                  cal = x.get("cal")
                  if brand and name and cal is not None:
                      by_key[(brand, name, size, round(float(cal), 2))] = x

              brands = discover_brand_links(list_url)
              print(label, "brands discovered:", len(brands), flush=True)

              all_products = []
              with ThreadPoolExecutor(max_workers=8) as pool:
                  futures = [pool.submit(fetch_products_for_brand, brand, url) for brand, url in brands]
                  for fut in as_completed(futures):
                      brand, products, err = fut.result()
                      if err:
                          print(f"[{label}] brand failed: {brand}: {err}", flush=True)
                          continue
                      print(f"[{label}] {brand}: {len(products)} product links", flush=True)
                      for product_name, product_url in products:
                          all_products.append((brand, product_name, product_url, kind))

              # URL 去重，避免同一商品重複請求。
              uniq = []
              seen_urls = set()
              for product in all_products:
                  if product[2] in seen_urls:
                      continue
                  seen_urls.add(product[2])
                  uniq.append(product)
              all_products = uniq
              print(label, "unique product pages:", len(all_products), flush=True)

              fetched_products = 0
              failed_products = 0
              with ThreadPoolExecutor(max_workers=12) as pool:
                  futures = [pool.submit(fetch_product, p) for p in all_products]
                  for n, fut in enumerate(as_completed(futures), 1):
                      product, variants, err = fut.result()
                      brand, product_name, product_url, _ = product
                      if err:
                          failed_products += 1
                      else:
                          fetched_products += 1
                          q = parse_qs(urlparse(product_url).query)
                          cid = (q.get("company_id") or [""])[0]
                          itemno = (q.get("itemno") or [""])[0]
                          for size, cal in variants:
                              display_name = product_name
                              if size and size not in ("每份", "份") and size not in display_name:
                                  display_name = f"{product_name}（{size}）"
                              item = {
                                  "id": f"{kind}:{cid}:{itemno}:{size or 'default'}",
                                  "brand": brand,
                                  "store": brand,
                                  "name": display_name,
                                  "cal": round(float(cal), 2),
                                  "unit": "杯" if kind == "drinkshop" else "份",
                                  "size": size,
                                  "quality": "official-public",
                                  "source": "臺北市食材登錄平台",
                                  "sourceUrl": product_url,
                                  "updatedAt": datetime.now(timezone.utc).date().isoformat(),
                              }
                              by_key[(brand, display_name, size, round(float(cal), 2))] = item

                      if n % 50 == 0 or n == len(all_products):
                          print(f"[{label}] progress: {n}/{len(all_products)}", flush=True)

              items = list(by_key.values())
              items.sort(key=lambda x: (x.get("brand") or "", x.get("name") or "", x.get("size") or ""))
              out = {
                  "meta": {
                      "name": label,
                      "status": "ok" if items else "empty",
                      "generatedAt": datetime.now(timezone.utc).isoformat(),
                      "source": list_url,
                      "count": len(items),
                      "brandsDiscovered": len(brands),
                      "productPagesDiscovered": len(all_products),
                      "productPagesFetched": fetched_products,
                      "productPagesFailed": failed_products,
                      "crawlMode": "stable",
                      "note": "穩定模式只抓官方頁面當下直接回傳的業者/商品連結，不暴力猜分頁；既有資料會保留。現調飲品熱量依杯型、甜度、配料而異。"
                  },
                  "items": items
              }
              Path(out_path).write_text(json.dumps(out, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              print(label, "items written:", len(items), flush=True)

          try:
              crawl(FASTFOOD_LIST, "fastfood", "fastfood-foods.json", "台灣西式連鎖速食公開熱量資料庫")
          except Exception as e:
              print("Fast-food crawl failed; keeping existing file:", repr(e), flush=True)

          try:
              crawl(DRINK_LIST, "drinkshop", "drink-shop-foods.json", "台灣連鎖飲冰品公開熱量資料庫")
          except Exception as e:
              print("Drink-shop crawl failed; keeping existing file:", repr(e), flush=True)
          PY

      - name: Commit updated databases
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tfda-foods.json fastfood-foods.json drink-shop-foods.json
          if git diff --cached --quiet; then
            echo "No database changes"
          else
            git commit -m "Update food databases"
            git push
          fi
